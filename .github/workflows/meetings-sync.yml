name: Meetings sync (Google Calendar + Meet)

on:
  schedule:
    # Hourly, not every five minutes.
    #
    # This workflow PULLS calendar events into Supabase. It has nothing to do
    # with creating a Meet link — that happens synchronously in the browser
    # through /api/meet when you press the button, and is unaffected by this
    # schedule. Nobody was ever waiting on this cron for a link.
    #
    # At */5 across 19 hours it fired ~228 times a day. GitHub bills private-repo
    # Actions with a one-minute minimum per run, so that one line was ~6,800
    # minutes a month against a 2,000-minute allowance — while making a calendar
    # four minutes fresher than hourly.
    - cron: '0 2-20 * * *'
  workflow_dispatch:

concurrency:
  group: meetings-sync
  cancel-in-progress: true

jobs:
  meetings:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Create queued meetings on Google Calendar
        run: node scripts/meeting-worker.mjs
        env:
          SUPABASE_URL: https://xroynvkzephebhcztvfo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_WORK_REFRESH_TOKEN: ${{ secrets.GOOGLE_WORK_REFRESH_TOKEN }}
          GOOGLE_WORK_CALENDAR_ID: ${{ secrets.GOOGLE_WORK_CALENDAR_ID }}
          GOOGLE_THIRD_REFRESH_TOKEN: ${{ secrets.GOOGLE_THIRD_REFRESH_TOKEN }}
          GOOGLE_THIRD_CALENDAR_ID: ${{ secrets.GOOGLE_THIRD_CALENDAR_ID }}
          GOOGLE_THIRD_LABEL: ${{ secrets.GOOGLE_THIRD_LABEL }}
