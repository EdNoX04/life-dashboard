name: Binance sync

# Read-only. scripts/binance-sync.mjs makes GET requests to balance and history
# endpoints only — no order placement, no withdrawal, no transfer, not even
# behind a flag. The key this uses must be created with "Enable Reading" alone.
#
# Twice a day rather than continuously: P2P orders and deposits are events you
# make by hand a few times a month, not a live feed, and Binance's history
# endpoints are weight-limited. Two runs give same-day visibility without
# spending rate limit on nothing changing.

on:
  schedule:
    - cron: '0 3 * * *'    # 08:30 IST
    - cron: '0 15 * * *'   # 20:30 IST
  workflow_dispatch:

concurrency:
  group: binance-sync
  cancel-in-progress: true

jobs:
  binance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sync Binance
        run: node scripts/binance-sync.mjs
        env:
          SUPABASE_URL: https://xroynvkzephebhcztvfo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          # Optional. Default is 120 days. Raise it once to backfill further,
          # then put it back — every extra day is more paged requests against a
          # weight limit, on history that does not change.
          BINANCE_LOOKBACK_DAYS: '120'
