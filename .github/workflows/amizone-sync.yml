name: Amizone sync

# Replaces the Playwright/Turnstile version, which never once succeeded: runs
# #19-#25 all reported turnstile=MISSING, because Cloudflare Turnstile will not
# issue a token to a datacenter IP. This workflow never logs in, so Turnstile is
# never involved. It sends one already-valid .ASPXAUTH ticket (obtained by a
# human logging in on a real browser, once) and parses HTML. No browser, no
# Chromium download, no xvfb — a run is seconds instead of minutes.
#
# The ticket is stored in Supabase (memory.amizone_cookie), not here, so the
# script can persist the value ASP.NET reissues under sliding expiration and the
# session renews itself. The AMIZONE_COOKIE secret is only a bootstrap: it is
# used on the very first run, and again if the stored ticket ever goes dead.
#
# When the ticket finally does expire for real, the run fails loudly AND writes
# sync_status.amizone.ok = false with a reason, so the dashboard's Background
# sync card says "re-paste the cookie" instead of quietly serving stale numbers.

on:
  schedule:
    # every 2h across the college day, IST = UTC+5:30
    - cron: '0 1 * * *'      # 06:30 IST
    - cron: '0 3 * * *'      # 08:30 IST
    - cron: '0 5 * * *'      # 10:30 IST
    - cron: '0 7 * * *'      # 12:30 IST
    - cron: '0 9 * * *'      # 14:30 IST
    - cron: '0 11 * * *'     # 16:30 IST
    - cron: '0 13 * * *'     # 18:30 IST
    - cron: '0 15 * * *'     # 20:30 IST
  workflow_dispatch:          # manual "Sync now" button in the Actions tab

concurrency:
  group: amizone-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'

      # linkedom gives a real DOMParser, so the parsing code here is the SAME
      # code that runs in the browser path. A different HTML parser would mean
      # two parsers to keep in step, and a divergence nobody would notice until
      # attendance quietly went wrong.
      - name: Install linkedom
        run: npm install --no-save linkedom@0.18.5

      # THIS RUNNER NO LONGER TALKS TO AMIZONE AT ALL.
      #
      # Two things were measured on 2026-09-05 and together they end the
      # cookie-in-the-cloud design:
      #
      #   · `.ASPXAUTH` is HttpOnly — document.cookie on an Amizone page is the
      #     empty string while requests from it are authenticated. The
      #     bookmarklet reads document.cookie, so it can never work again.
      #   · The session does not travel. A ticket serving Neel's own browser for
      #     33 minutes died within minutes of being used from two datacenters.
      #     Whether that is IP binding or one-session-per-user was never
      #     separated; both are avoided by not moving the credential.
      #
      # So the fetching happens in a Chrome extension on his machine, where the
      # session already is, and this step only PARSES what it captured — the same
      # parser, the same tests, the same output. No cookie is needed here, which
      # is why AMIZONE_COOKIE is gone from this step.
      #
      # Refuses to publish captures older than 6 hours: writing week-old HTML out
      # as today's attendance is not a visible error, it is a dashboard lying
      # quietly, which is the failure this whole file keeps meeting.
      - name: Parse the pages the browser captured
        run: node automation/amizone/amizone-cookie-sync.mjs --from-raw --out /tmp/amizone-payload.json
        env:
          SUPABASE_URL: https://xroynvkzephebhcztvfo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Push to Supabase
        run: node automation/amizone/amizone-push.mjs --payload /tmp/amizone-payload.json
        env:
          SUPABASE_URL: https://xroynvkzephebhcztvfo.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # The payload is Neel's own attendance, no credentials — but it is still
      # personal data, so it is kept only when a run failed and only for a day.
      - name: Upload payload on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: amizone-payload
          path: /tmp/amizone-payload.json
          retention-days: 1
          if-no-files-found: ignore
