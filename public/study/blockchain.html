/* ------------------------------------------------------------------
   Self-contained on purpose. No web fonts, no CDN, no network at all —
   this file has to work on a phone in a corridor with no signal the
   morning of the exam, and anything fetched is something that can fail
   at exactly the wrong moment.
   ------------------------------------------------------------------ */
:root{
  --bg:#080a12; --bg-2:#0d1120; --panel:#111629; --panel-2:#151b31;
  --ink:#e8ecff; --ink-2:#a8b2d8; --ink-3:#6b769e;

  --green:#31d67a; --red:#ff4d5a; --orange:#ff9f43;
  --border:#222c4d; --border-bright:#31406e;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono",monospace;
  --sub:var(--cyan);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--mono); font-size:15px; line-height:1.6;
  overflow-x:hidden;
}
/* The CRT. Fixed, pointer-events:none, and switched off entirely under
   prefers-reduced-motion — a flickering overlay is a migraine trigger, and
   this is a document somebody stares at for six hours straight. */
#crt{position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.22) 0 1px,rgba(0,0,0,0) 1px 3px);
  mix-blend-mode:multiply;opacity:.55}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
body.plain #crt,body.plain #vig{display:none}
@media (prefers-reduced-motion:reduce){#crt{opacity:.25}}
@media print{#crt,#vig,#bar,#side,#tocbtn,.noprint{display:none!important}}

a{color:var(--cyan)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:.04em}
code,kbd{font-family:var(--mono);background:#0a0e1a;border:1px solid var(--border);
  border-radius:4px;padding:1px 5px;font-size:.88em;color:var(--yellow)}
kbd{color:var(--ink-2)}
mark{background:var(--yellow);color:#0a0e1a;border-radius:2px;padding:0 2px}

   which clips every card on the right. It truncates instead. */
#brand{font-size:12px;letter-spacing:.18em;color:var(--sub);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;max-width:min(34vw,300px);flex:0 1 auto;
  text-shadow:0 0 12px currentColor}
#bar>*{min-width:0}
#brand b{color:var(--ink)}
#count{flex:0 0 auto;font-size:11px;color:var(--ink-2);border:1px solid var(--border-bright);
  border-radius:999px;padding:3px 10px;white-space:nowrap}
#count b{color:var(--yellow)}
#q{flex:1;min-width:150px;background:#0a0e1a;border:1px solid var(--border-bright);
  color:var(--ink);border-radius:6px;padding:7px 10px;font-family:var(--mono);font-size:13px;outline:none}
#q:focus{border-color:var(--sub);box-shadow:0 0 0 2px rgba(0,229,255,.15)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}
.tab{background:#0a0e1a;border:1px solid var(--border-bright);color:var(--ink-2);
  border-radius:6px;padding:6px 11px;font-family:var(--mono);font-size:12px;cursor:pointer;
  letter-spacing:.06em;white-space:nowrap}
.tab:hover{color:var(--ink);border-color:var(--sub)}
.tab.on{background:var(--sub);color:#080a12;border-color:var(--sub);font-weight:700}
.mini{flex:0 0 auto;background:transparent;border:1px solid var(--border-bright);color:var(--ink-2);

.mini:hover{color:var(--ink);border-color:var(--sub)}

/* progress rail under the bar */

/* ---------------- layout ---------------- */
#wrap{display:flex;gap:0;align-items:flex-start;max-width:1500px;margin:0 auto}
#side{position:sticky;top:56px;width:270px;flex:0 0 270px;max-height:calc(100vh - 60px);

#main{flex:1;min-width:0;padding:16px 18px 120px 18px}
@media(max-width:900px){

  #side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.8)}

#tocbtn{display:none}
#scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:79}

.modbody{display:none;padding:6px 14px 16px}

.topic{border-top:1px solid var(--border);padding:12px 0 4px}
.topic:first-child{border-top:0}
.topic h3{font-size:13.5px;color:var(--sub);display:flex;gap:8px;align-items:flex-start;line-height:1.4}

ul.pts{margin:8px 0 0;padding-left:18px}
ul.pts li{margin:4px 0;color:var(--ink-2);font-size:13px}
ul.pts li b,ul.pts li strong{color:var(--ink)}
.def{border-left:2px solid var(--purple);padding:6px 0 6px 10px;margin:8px 0;
  color:var(--ink);font-size:13px;background:rgba(124,77,255,.06)}

.box{border:1px solid;border-radius:8px;padding:9px 11px;margin:10px 0;font-size:12.5px}
.box .bh{font-size:10px;letter-spacing:.16em;margin-bottom:5px;font-weight:700}
.box ul{margin:4px 0 0;padding-left:16px}
.box li{margin:3px 0}
.extra{border-color:var(--yellow);background:rgba(255,210,63,.07);color:var(--ink-2)}

.mnem{border-color:var(--pink);background:rgba(255,61,127,.07);color:var(--ink-2)}

.src{border-color:var(--border-bright);background:rgba(255,255,255,.02);color:var(--ink-3);font-size:11.5px}
.src .bh{color:var(--ink-3)}

table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;display:block;overflow-x:auto}
th,td{border:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--panel-2);color:var(--sub);font-weight:700;font-size:11px;
  letter-spacing:.06em;white-space:nowrap}
td{color:var(--ink-2)}
tr:nth-child(even) td{background:rgba(255,255,255,.015)}

/* self-test */
.qa{border:1px solid var(--border-bright);border-radius:8px;margin:8px 0;overflow:hidden}
.qa .qq{padding:9px 11px;cursor:pointer;font-size:13px;color:var(--ink);background:var(--panel-2);
  display:flex;gap:8px;align-items:flex-start}
.qa .qq:hover{background:#1a2140}
.qa .qq .m{color:var(--pink);flex:0 0 auto}
.qa .aa{display:none;padding:9px 11px;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--border);background:rgba(49,214,122,.05)}
.qa.open .aa{display:block}

.marks{font-size:11px;color:var(--ink-3);margin-left:auto;white-space:nowrap}
.pill{display:inline-block;font-size:10px;letter-spacing:.1em;border-radius:999px;
  padding:2px 8px;border:1px solid;margin-right:6px}
.p-core{color:var(--green);border-color:var(--green)}
.p-min{color:var(--pink);border-color:var(--pink)}
.hidden{display:none!important}
#nores{color:var(--ink-3);font-size:13px;padding:20px;text-align:center}
.foot{color:var(--ink-3);font-size:11.5px;margin-top:28px;border-top:1px solid var(--border);
  padding-top:12px;line-height:1.7}
.jump{position:fixed;right:14px;bottom:14px;z-index:70;display:flex;flex-direction:column;gap:6px}
.jump button{width:38px;height:38px;border-radius:9px;background:var(--panel);
  border:1px solid var(--border-bright);color:var(--ink-2);font-family:var(--mono);cursor:pointer;font-size:14px}
.jump button:hover{color:var(--sub);border-color:var(--sub)}
</style>

  ],
  foot: 'Built from the CSE475 module list. Verify module weightings against your course handout before the exam.',
  modules: [],
  quiz: []
};

SUBJECT.modules.push({
  title: 'Introduction to Blockchain and Blockchain Platforms',
  short: 'Intro & Platforms',
  weight: '20%',
  intro: 'Definitions, the data structure itself, consensus, and the taxonomy of platforms. Almost every paper opens here, and almost every mark lost here is lost to a vague definition.',
  topics: [
    {
      id:'bc1-def', title:'What a blockchain actually is — the data structure',
      def:'A blockchain is a distributed, append-only ledger of transactions, replicated across a peer-to-peer network, in which each block contains a cryptographic hash of the previous block — making the chain tamper-evident — and agreement on its contents is reached by a consensus mechanism rather than by a central authority.',
      points:[
        '<b>Block structure — header + body.</b> The <b>header</b> holds: previous block hash, Merkle root, timestamp, nonce, difficulty target, and version. The <b>body</b> holds the list of transactions.',
        '<b>The previous-block hash is what makes it a chain.</b> Change one byte in block 400, and block 400\'s hash changes, so block 401\'s stored "previous hash" no longer matches — and so on to the tip. Tampering with one block invalidates every block after it.',
        '<b>Merkle tree</b> — transactions are hashed pairwise up to a single <b>Merkle root</b> stored in the header. Two consequences worth stating: (1) any change to any transaction changes the root, so the header commits to all of them; (2) you can prove a transaction is in a block with only log₂(n) hashes — a <b>Merkle proof</b> — which is what allows lightweight SPV clients that never download a full block.',
        '<b>Five core properties:</b> decentralisation, immutability (append-only, tamper-evident), transparency, security through cryptography, and consensus-based validation.',
        '<b>Nonce</b> — the number miners vary to search for a hash below the difficulty target. It is the only freely adjustable field in the header, which is why mining is brute force.',
        '<b>Types of node:</b> <i>full nodes</i> store and validate the entire chain independently; <i>light/SPV nodes</i> store headers only and rely on Merkle proofs; <i>mining/validator nodes</i> propose new blocks; <i>archive nodes</i> retain every historical state.'
      ],
      extra:[
        '<b>Immutable is not the same as unchangeable.</b> Say "tamper-<i>evident</i>" — the data can be rewritten by anyone with enough hash power, but doing so is detectable and economically irrational. That precision is a mark.',
        '<b>Genesis block</b> — block 0, hard-coded into the client, the only block with no predecessor. Bitcoin\'s contains the Times headline of 3 January 2009.',
        '<b>The blockchain trilemma</b> (Vitalik Buterin): decentralisation, security and scalability — you can optimise for two. Bitcoin chooses decentralisation and security; a permissioned chain like Fabric chooses scalability and security by sacrificing open decentralisation. This one framework answers a surprising number of "compare X and Y" questions.',
        '<b>Hash function properties</b> to name: deterministic, fast to compute, pre-image resistant (cannot invert), second-pre-image and collision resistant, and the <b>avalanche effect</b> — one bit of input flips about half the output bits. Bitcoin uses SHA-256; Ethereum uses Keccak-256.'
      ],
      trap:['The blockchain does not store "the balance". Bitcoin stores <b>UTXOs</b> (unspent transaction outputs) and a balance is derived by summing the ones you can spend. Ethereum, by contrast, uses an <b>account/balance model</b> with an explicit nonce per account to prevent replay. This distinction is asked constantly.'],
      qa:[{q:'How does a Merkle tree let a phone verify a payment without downloading the blockchain?',a:'The phone stores only block headers, which include the Merkle root. To verify that a transaction is in a block it requests a Merkle proof — the sibling hashes along the path from that transaction to the root, about log₂(n) hashes. It recomputes the root from the transaction and the proof; if it matches the root in the header it already trusts, the transaction is in that block. For a block of a million transactions that is roughly 20 hashes instead of a gigabyte.'}]
    },
    {
      id:'bc1-types', title:'Public, private, consortium and permissioned — the taxonomy',
      table:{head:['','Public','Private','Consortium'],rows:[
        ['Who can read','Anyone','Restricted','Restricted to members'],
        ['Who can write','Anyone','One organisation','A pre-selected group'],
        ['Consensus','PoW / PoS, open participation','Central or trusted nodes','Voting / PBFT / Raft among members'],
        ['Speed','Low (7–30 TPS)','High (thousands of TPS)','High'],
        ['Identity','Pseudonymous','Known','Known (via MSP/CA)'],
        ['Examples','Bitcoin, Ethereum','Internal corporate ledger','Hyperledger Fabric, R3 Corda, Quorum']
      ]},
      points:[
        '<b>Permissionless</b> — anyone may join, read and propose blocks. Trust comes from economics (cost of attack) and cryptography.',
        '<b>Permissioned</b> — participants are identified and authorised in advance. Trust comes from identity and governance, which is why permissioned chains can use far cheaper consensus and reach far higher throughput.',
        '<b>Consortium</b> is the middle case that matters commercially: several competing organisations who do not fully trust each other but do know who each other are — supply chain, trade finance, interbank settlement.'
      ],
      extra:[
        '<b>Two independent axes, not one.</b> "Public/private" is about who can <i>read</i>; "permissioned/permissionless" is about who can <i>write and validate</i>. All four combinations exist — a public permissioned chain (readable by all, written by an authorised set) is a real and increasingly common design.',
        '<b>Why permissioned chains do not need mining.</b> Proof of Work exists to solve Sybil resistance in an open network where identity is free. If identity is established at admission, the Sybil problem disappears and you can use cheap, deterministic, instantly-final consensus like Raft or PBFT. This is the single best explanation of why Fabric is fast, and it earns marks in three different modules.'
      ],
      trap:['<b>Private ≠ permissioned.</b> Fabric is permissioned; whether any given channel\'s data is private is a separate design decision. Conflating them is the most common error in this module.']
    },
    {
      id:'bc1-consensus', title:'Consensus mechanisms — PoW, PoS, PBFT, Raft and the rest',
      def:'Consensus is the process by which distributed nodes agree on a single, consistent ordering of transactions without a central coordinator. It exists to solve the Byzantine Generals Problem: reaching agreement when some participants may be faulty or actively malicious.',
      table:{head:['Mechanism','Basis','Finality','Energy','Fault tolerance','Used by'],rows:[
        ['<b>PoW</b>','Computational work','Probabilistic','Very high','50% hash power','Bitcoin, Litecoin'],
        ['<b>PoS</b>','Staked capital','Probabilistic → finalised in epochs','Very low','⅓ stake','Ethereum (post-Merge)'],
        ['<b>DPoS</b>','Elected delegates','Fast','Low','⅔ of delegates','EOS, Tron'],
        ['<b>PBFT</b>','Voting rounds','<b>Immediate</b>','Low','<b>(n−1)/3</b> malicious','Fabric (legacy), Tendermint'],
        ['<b>Raft</b>','Leader election','Immediate','Low','<b>Crash faults only</b> — not Byzantine','Fabric ordering service'],
        ['<b>PoET</b>','Trusted wait time','Probabilistic','Low','Depends on TEE','Hyperledger Sawtooth'],
        ['<b>PoA</b>','Approved identities','Immediate','Low','Trusted validators','Testnets, private chains']
      ]},
      points:[
        '<b>Proof of Work:</b> miners vary the nonce until <code>SHA-256(SHA-256(header)) &lt; target</code>. Finding it is astronomically hard; verifying it is one hash. Bitcoin retargets difficulty every 2016 blocks to hold a ~10-minute average block time.',
        '<b>The 51% attack:</b> control of a majority of hash power lets an attacker exclude or reorder transactions and <b>double-spend</b> by privately mining a longer competing chain. It does <i>not</i> let them steal coins from arbitrary addresses or forge signatures — that would require breaking ECDSA.',
        '<b>Proof of Stake:</b> validators lock capital as a stake; the protocol selects a proposer pseudo-randomly, weighted by stake. Misbehaviour is punished by <b>slashing</b> — burning part of the stake. Ethereum requires 32 ETH per validator; finality is reached over two epochs (about 12.8 minutes).',
        '<b>Nothing-at-stake problem:</b> in naive PoS, validating on every competing fork costs nothing, so there is no incentive to converge. Slashing solves it by making equivocation expensive.',
        '<b>PBFT (Practical Byzantine Fault Tolerance):</b> three phases — <i>pre-prepare</i>, <i>prepare</i>, <i>commit</i>. Tolerates <b>f</b> faulty nodes out of <b>3f+1</b>. Gives <b>immediate finality</b> — once committed, never reversed. The cost is O(n²) message complexity, which is why it only works for small, known validator sets.',
        '<b>Raft</b> is crash-fault tolerant only: it assumes nodes may fail but not lie. Tolerates f failures out of 2f+1. Fabric uses it for ordering because in a permissioned consortium the orderers are known and accountable.',
        '<b>Forks:</b> a <b>soft fork</b> is backward-compatible (old nodes still accept new blocks — a tightening of rules); a <b>hard fork</b> is not (a permanent divergence). Ethereum/Ethereum Classic after the DAO hack is the canonical hard fork.'
      ],
      extra:[
        '<b>Probabilistic vs deterministic finality.</b> In PoW a block is never <i>certainly</i> final — it becomes exponentially unlikely to be reversed, which is why exchanges wait six confirmations. In PBFT/Raft, commitment is final immediately. Being able to say why an enterprise chain needs deterministic finality (you cannot ship goods against a payment that might un-happen) is a strong applied point.',
        '<b>3f+1 is worth deriving, not just quoting.</b> With n nodes and f Byzantine, you must make progress without hearing from f (they may be silent), so you decide on n−f responses; of those, f could be lying, so the honest majority among them needs n−2f > f, giving n > 3f.',
        '<b>The Merge (Sept 2022)</b> moved Ethereum from PoW to PoS and cut its energy consumption by roughly 99.95%. A concrete, quotable number.'
      ],
      trap:['Raft is <b>not</b> Byzantine fault tolerant. If an exam asks which Fabric ordering service tolerates malicious orderers, the honest answer is that Raft does not — it tolerates crashes, and Fabric relies on the permissioned identity layer plus endorsement policies for Byzantine protection.'],
      mnem:['<b>PoW = burn electricity. PoS = burn money (if you cheat). PBFT = vote, and you need 2 out of every 3 honest.</b>']
    },
    {
      id:'bc1-crypto', title:'The cryptography underneath — hashing, keys and signatures',

  intro: 'Fabric is the enterprise counterpoint to Ethereum: permissioned, modular, no cryptocurrency, and with an execution model deliberately unlike everything in Module II. The execute-order-validate flow is the single highest-value thing in this module.',

  intro: 'The highest-weighted module and the easiest to under-prepare because it feels like general knowledge. It is not: marks come from naming a concrete platform, a specific problem it solves, and — critically — being willing to say when a blockchain is the <i>wrong</i> answer.',

});

SUBJECT.quiz = [
  {q:'Explain how a blockchain achieves immutability.',a:'Each block header contains the cryptographic hash of the previous block header, so altering any byte of an earlier block changes its hash and breaks the stored link in every subsequent block. The header also commits to a Merkle root over the transactions, so no individual transaction can be swapped without changing the root. To make a tampered chain accepted, an attacker must re-do the proof of work (or re-stake) for that block and every block after it, faster than the honest network is extending the real chain — which is why it is tamper-evident and economically infeasible rather than physically impossible.'},
  {q:'Compare PoW and PoS across five dimensions.',a:'Basis: computational work vs staked capital. Energy: very high vs roughly 99.95% lower. Attack threshold: 51% of hash power vs about one third of stake for liveness attacks. Punishment: an attacker loses only their electricity vs slashing, which burns the stake itself. Finality: probabilistic in both, but PoS adds explicit epoch-based finalisation. Entry barrier: specialised ASIC hardware vs capital (32 ETH per validator).'},
  {q:'Describe the Fabric transaction flow.',a:'Propose — the client sends a proposal to the endorsing peers named in the endorsement policy. Execute — each simulates the chaincode against its own world state and returns a signed read-write set without committing. Collect — the client checks the endorsements agree. Order — the ordering service (Raft) places the endorsed transaction into a total order and cuts blocks. Validate — every committing peer checks the endorsement policy is satisfied and performs the MVCC read-set version check. Commit — valid transactions update the world state; invalid ones are still appended to the blockchain, flagged invalid.'},
  {q:'What is gas and why is it necessary?',a:'Gas is the unit measuring computational effort; each EVM opcode has a fixed gas cost and the sender pays gas used × gas price. It is necessary because the EVM is Turing-complete, so nodes cannot decide in advance whether a contract halts — gas bounds execution economically instead. It simultaneously prices denial-of-service attacks, since an infinite loop costs the attacker real money, and it allocates scarce block space to those who value it most.'},
  {q:'Differentiate public, private and consortium blockchains.',a:'Public: anyone may read, write and validate; pseudonymous; secured by open consensus like PoW or PoS; low throughput; Bitcoin and Ethereum. Private: a single organisation controls read and write; participants are known; consensus can be trivial; high throughput. Consortium: a pre-selected group of mutually distrusting but identified organisations share write and validation rights, typically with BFT or Raft consensus and high throughput; Hyperledger Fabric and R3 Corda. Note that public/private describes read access while permissionless/permissioned describes write and validation rights — they are separate axes.'},
  {q:'What is a smart contract and what are its limitations?',a:'Self-executing code deployed at a blockchain address whose terms are enforced by the network rather than by a party or a court. Limitations: it is immutable once deployed, so bugs cannot be patched without a proxy pattern; it is deterministic and sandboxed, so it cannot fetch external data and depends on oracles, reintroducing a trusted party; all its data and code are public, so nothing is confidential; execution costs gas, so complex logic is expensive; and legal enforceability is unsettled — "code is law" does not survive contact with a court, as the DAO fork demonstrated.'},
  {q:'Explain reentrancy with reference to the DAO.',a:'A contract makes an external call — sending ETH — before updating its own internal accounting. The external call transfers control to the recipient, whose fallback function calls back into the original function while the state still shows the pre-withdrawal balance, allowing repeated withdrawal. The DAO lost about 3.6 million ETH to exactly this in June 2016, leading to the hard fork that split Ethereum and Ethereum Classic. The fix is the Checks-Effects-Interactions ordering plus a reentrancy guard.'},
  {q:'When is a blockchain the wrong solution?',a:'When a single trusted party already exists and is acceptable, when only one entity writes, when the data is high-volume or large (files belong off-chain with hashes on-chain), when confidentiality is required on a public chain, when records must be legally erasable under GDPR, when low latency and high throughput are essential, or when the real trust problem is the accuracy of data at the point of entry — because no consensus mechanism can validate what a sensor or a person put in. In these cases a replicated, audited, append-only database is cheaper, faster and easier to correct.'},
  {q:'What are the four Composer model artefacts?',a:'The .cto model file defining Participants, Assets, Transactions and Events; the .js script file with transaction processor functions; permissions.acl declaring who may do what to which resource; and the .qry query file. All four are packaged into a Business Network Archive (.bna) and deployed onto a running Hyperledger Fabric network. Composer itself was deprecated in 2019 in favour of the Fabric contract and application SDKs.'},
  {q:'Why is a Merkle tree used rather than hashing all transactions together?',a:'A single concatenated hash would commit to all transactions but would give no way to prove that one particular transaction is included without supplying every other transaction. The Merkle tree gives the same tamper-evidence while allowing an inclusion proof of size log₂(n) — the sibling hashes along one path — so a lightweight client holding only block headers can verify a payment with about twenty hashes instead of the full block.'}
];
</script>
<script>
/* ==================================================================
   RENDERER — one template, driven by the SUBJECT object above it.
   Every subject file is this same code with a different SUBJECT, so a
   fix here is a fix everywhere and the three files never drift apart.
   State (checkboxes, open module) is namespaced by SUBJECT.slug, so
   ticking a Blockchain topic never lights up an IoT one.
   ================================================================== */
(function(){
  var S = window.SUBJECT;
  var KEY = 'p1study:' + S.slug;
  var done = {};              // topicId -> true
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ done = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }

  document.title = 'PLAYER ONE — ' + S.name;
  // Short label only. The hero heading below already carries the full name and
  // code; repeating them here is what pushed the bar past the viewport width.
  document.getElementById('brand').innerHTML = '▮ <b>' + esc(S.short || S.name) + '</b>';

  // ---- flatten topics for search/progress ----
  var allTopics = [];
  S.modules.forEach(function(m){ (m.topics||[]).forEach(function(t){ allTopics.push(t); }); });

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  // ---------------- sidebar ----------------
  function buildSide(){
    var el = document.getElementById('side');
    var h = '<div class="tochead">'+esc(S.name)+'</div>';
    h += '<button class="tocmod" onclick="scrollToId(\'top\')"><span class="n">▸</span>Overview &amp; exam plan</button>';
    S.modules.forEach(function(m,i){
      h += '<button class="tocmod" data-mod="'+i+'" onclick="openMod('+i+',true)">'
         + '<span class="n">M'+(i+1)+'</span>'+esc(m.short||m.title)
         + '<span class="pc" id="pc'+i+'"></span></button>';
    });
    if(S.exam){
      h += '<div class="tochead">Self-test</div>';
      h += '<button class="tocmod" onclick="scrollToId(\'quiz\')"><span class="n">?</span>Likely questions</button>';
    }
    el.innerHTML = h;
  }

  // ---------------- topic renderer ----------------
  function renderTopic(t){
    var cls = 'topic' + (done[t.id]?' done':'');
    var h = '<div class="'+cls+'" id="'+t.id+'" data-topic="1">';
    h += '<h3><input type="checkbox" class="chk" '+(done[t.id]?'checked':'')
       + ' onchange="toggleTopic(\''+t.id+'\',this.checked)"><span>'+esc(t.title)+'</span>';
    if(t.tag==='min') h += '';
    h += '</h3>';
    if(t.def) h += '<div class="def">'+t.def+'</div>';
    if(t.points && t.points.length){
      h += '<ul class="pts">';
      t.points.forEach(function(p){ h += '<li>'+p+'</li>'; });
      h += '</ul>';
    }
    if(t.table) h += renderTable(t.table);
    if(t.extra) h += box('extra','EXTRA MARKS ✦', t.extra);
    if(t.trap)  h += box('trap','EXAM TRAP ⚠', t.trap);
    if(t.mnem)  h += box('mnem','REMEMBER IT ◆', t.mnem);
    if(t.qa && t.qa.length){
      t.qa.forEach(function(q){
        h += '<div class="qa" onclick="this.classList.toggle(\'open\')">'
           + '<div class="qq"><span class="m">Q</span><span>'+esc(q.q)+'</span></div>'
           + '<div class="aa">'+q.a+'</div></div>';
      });
    }
    h += '</div>';
    return h;
  }
  function box(cls,label,body){
    var inner = Array.isArray(body)
      ? '<ul>'+body.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
      : '<div>'+body+'</div>';
    return '<div class="box '+cls+'"><div class="bh">'+label+'</div>'+inner+'</div>';
  }
  function renderTable(tb){
    var h = '<table><thead><tr>';
    tb.head.forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    tb.rows.forEach(function(r){
      h += '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';
    });
    h += '</tbody></table>';
    return h;
  }

  // ---------------- main ----------------
  function buildMain(){
    var el = document.getElementById('main');
    var h = '';
    h += '<div class="hero" id="top">'
       + '<div class="code">'+esc(S.code)+' · MINOR EXAM · '+esc(S.examLabel||'')+'</div>'
       + '<h1>'+esc(S.name)+'</h1>'
       + '<p>'+esc(S.blurb||'')+'</p>';
    if(S.plan){
      h += '<div class="box extra" style="margin-bottom:0"><div class="bh">HOW TO USE THIS ✦</div><ul>'
         + S.plan.map(function(x){return '<li>'+x+'</li>';}).join('') + '</ul></div>';
    }
    h += '</div>';

    S.modules.forEach(function(m,i){
      h += '<section class="mod" id="mod'+i+'" data-mod="'+i+'">';
      h += '<div class="modhead" onclick="openMod('+i+')">'
         + '<span class="caret">▶</span>'
         + '<h2><span style="color:var(--ink-3)">M'+(i+1)+'</span> &nbsp;'+esc(m.title)+'</h2>';
      if(m.weight) h += '<span class="wt">'+esc(m.weight)+'</span>';
      h += '</div>';
      h += '<div class="modbody">';
      if(m.intro) h += '<p style="color:var(--ink-2);font-size:12.5px;margin:8px 0 2px">'+m.intro+'</p>';
      (m.topics||[]).forEach(function(t){ h += renderTopic(t); });
      h += '</div></section>';
    });

    if(S.quiz && S.quiz.length){
      h += '<section class="mod open" id="quiz"><div class="modhead"><span class="caret">▶</span>'
         + '<h2><span style="color:var(--ink-3)">✱</span> &nbsp;Most likely questions — rapid self-test</h2></div>';
      h += '<div class="modbody">';
      h += '<p style="color:var(--ink-2);font-size:12.5px">Tap to reveal. If you can answer these cold, you are ready.</p>';
      S.quiz.forEach(function(q){
        h += '<div class="qa" onclick="this.classList.toggle(\'open\')">'
           + '<div class="qq"><span class="m">Q</span><span>'+esc(q.q)+'</span></div>'
           + '<div class="aa">'+q.a+'</div></div>';
      });
      h += '</div></section>';
    }

    h += '<div class="foot">'+ (S.foot||'') +'<br>Generated for Neel · PLAYER ONE life-dashboard · offline-ready, no network calls. '
       + 'Progress is saved on this device. Print to PDF for a paper copy.</div>';
    el.innerHTML = h;
  }

  // ---------------- interactions ----------------
  window.openMod = function(i, fromNav){
    var mod = document.getElementById('mod'+i);
    if(!mod) return;
    if(fromNav){ mod.classList.add('open'); }
    else { mod.classList.toggle('open'); }
    document.querySelectorAll('.tocmod[data-mod]').forEach(function(b){
      b.classList.toggle('on', +b.getAttribute('data-mod')===i);
    });
    if(fromNav){ mod.scrollIntoView({behavior:'smooth',block:'start'}); closeSideMobile(); }
    updateRail();
  };
  window.expandAll = function(on){
    document.querySelectorAll('.mod').forEach(function(m){ if(m.id!=='quiz') m.classList.toggle('open',on); });
    updateRail();
  };
  window.toggleTopic = function(id,val){
    if(val) done[id]=true; else delete done[id];
    save();
    var t=document.getElementById(id); if(t) t.classList.toggle('done',!!val);
    updateProgress();
  };
  window.scrollToId = function(id){ var e=document.getElementById(id); if(e){e.scrollIntoView({behavior:'smooth',block:'start'});} closeSideMobile(); };
  window.jumpNext = function(){
    for(var i=0;i<S.modules.length;i++){
      var ts=S.modules[i].topics||[];
      var undoneLeft = ts.some(function(t){return !done[t.id];});
      if(undoneLeft){ openMod(i,true); return; }
    }
    scrollTo(0,0);
  };
  window.toggleSide = function(){
    document.getElementById('side').classList.toggle('open');
    document.getElementById('scrim').classList.toggle('on');
  };
  function closeSideMobile(){
    if(window.innerWidth<=900){
      document.getElementById('side').classList.remove('open');
      document.getElementById('scrim').classList.remove('on');
    }
  }
  window.toggleCRT = function(){ document.body.classList.toggle('plain'); };

  // ---------------- progress ----------------
  function updateProgress(){
    var total=allTopics.length, n=0;
    allTopics.forEach(function(t){ if(done[t.id]) n++; });
    var pct = total? Math.round(n/total*100):0;
    document.getElementById('pcnt').textContent = pct+'%';
    document.getElementById('railfill').style.width = pct+'%';
    S.modules.forEach(function(m,i){
      var ts=m.topics||[], mn=0; ts.forEach(function(t){ if(done[t.id]) mn++; });
      var el=document.getElementById('pc'+i);
      if(el) el.textContent = ts.length? (mn+'/'+ts.length):'';
    });
  }
  function updateRail(){ /* rail reflects scroll depth on wide screens */ }

  // ---------------- search ----------------
  var qEl = document.getElementById('q');
  var timer=null;
  qEl.addEventListener('input', function(){
    clearTimeout(timer); timer=setTimeout(function(){ runSearch(qEl.value.trim().toLowerCase()); },120);
  });
  function runSearch(term){
    var main=document.getElementById('main');
    var old=document.getElementById('nores'); if(old) old.remove();
    if(!term){
      document.querySelectorAll('[data-topic]').forEach(function(t){ t.classList.remove('hidden'); unmark(t); });
      document.querySelectorAll('.mod').forEach(function(m){ m.classList.remove('hidden'); });
      return;
    }
    var hits=0;
    document.querySelectorAll('.mod').forEach(function(m){
      if(m.id==='quiz'){ m.classList.add('hidden'); return; }
      var any=false;
      m.querySelectorAll('[data-topic]').forEach(function(t){
        var txt=t.textContent.toLowerCase();
        var match=txt.indexOf(term)>=0;
        t.classList.toggle('hidden',!match);
        if(match){ any=true; hits++; }
      });
      m.classList.toggle('hidden',!any);
      if(any) m.classList.add('open');
    });
    if(!hits){
      var d=document.createElement('div'); d.id='nores';
      d.textContent='No topic mentions “'+term+'”. Try a shorter word.';
      main.appendChild(d);
    }
  }
  function unmark(){}

  // keyboard: "/" focuses search
  document.addEventListener('keydown',function(e){
    if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
    if(e.key==='Escape'){ qEl.value=''; runSearch(''); qEl.blur(); }
  });

  // ---------------- boot ----------------
  buildSide(); buildMain(); updateProgress();
  if(S.modules[0]) document.getElementById('mod0').classList.add('open');
})();
</script>
</body>
</html>
