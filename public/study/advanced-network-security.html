}

body.plain #crt,body.plain #vig{display:none}

table{width:100%;border-collapse:collapse;margin:10px 0;font-size:12px;display:block;overflow-x:auto}

<script>

  foot: 'Source: Module I and II decks by Dr. Shilpi Sharma (Amity). Content beyond those decks is standard-syllabus expansion and is labelled as such.',
  modules: [],
  quiz: []
};

SUBJECT.modules.push({
  title: 'VPN and Wireless / IoT Security',
  short: 'VPN & Wireless',
  weight: '20%',
  intro: 'The whole of this module is in your slide deck. It splits cleanly in two: <b>perimeter devices + VPNs</b> (firewalls, IDS/IPS, tunnels), then <b>wireless</b> (standards, WEP→WPA3, attacks, countermeasures). The two case studies at the end of the deck — KRACK and Colonial Pipeline — are near-certain to appear as a long question.',
  topics: [
    {
      id:'ans1-fw', title:'Firewalls — definition and the four types',
      def:'A firewall is a network security device that monitors incoming and outgoing traffic and permits or blocks it according to a defined set of security rules. It establishes a barrier between a trusted internal network and untrusted external networks.',
      points:[
        '<b>Packet-Filtering firewall</b> — inspects each packet in isolation against ACLs: source/destination IP, source/destination port, protocol. Stateless. Fast and cheap, but it has no memory of what came before, so it cannot tell a reply from an unsolicited packet.',
        '<b>Stateful Inspection firewall</b> — keeps a <i>state table</i> of active connections. A packet is allowed only if it belongs to an established session or legitimately starts one. Catches everything a packet filter misses about connection context.',
        '<b>Proxy firewall (Application-level gateway)</b> — terminates the connection and opens a second one on the client\'s behalf, so the two ends never touch. It can inspect the actual application payload (HTTP verbs, FTP commands). Highest security, highest latency.',
        '<b>Next-Generation Firewall (NGFW)</b> — stateful inspection plus deep packet inspection, integrated IPS, application awareness (blocks "Facebook chat" not just "port 443"), user-identity awareness and threat-intelligence feeds.',
        '<b>Advantages:</b> traffic control, single enforcement point, logging/auditing, network segmentation, hides the internal topology (with NAT).',
        '<b>Disadvantages:</b> cannot inspect encrypted traffic without breaking TLS; no defence against insider threats; misconfiguration is the single biggest cause of failure; a bottleneck under load; useless against attacks that ride an allowed protocol.'
      ],
      extra:[
        'Say the OSI layer for each type and you separate yourself instantly: packet-filter = Layer 3/4, stateful = Layer 4 (with L3 context), proxy = Layer 7, NGFW = Layer 3 through 7.',
        '<b>DMZ</b> — a demilitarised zone is a subnet between two firewalls holding the public-facing servers (web, mail, DNS). Anything in the DMZ is assumed compromisable; it gets no trusted route inward.',
        '<b>Default-deny vs default-allow.</b> A correctly written rulebase ends in an implicit <code>deny any any</code>. Rule order matters — the first match wins, so a broad allow near the top silently disables every deny beneath it.',
        '<b>Egress filtering</b> is the half everyone forgets. Filtering what leaves is how you catch data exfiltration and command-and-control beaconing after the perimeter has already failed.'
      ],
      trap:['A <b>stateful</b> firewall tracks connections; a <b>proxy</b> firewall terminates and rebuilds them. Both are "more than packet filtering" but only the proxy actually reads the application payload.'],
      qa:[{q:'Why can a packet-filtering firewall not stop a TCP ACK scan?',a:'Because it evaluates each packet on its own. An ACK packet with no matching session looks like ordinary mid-conversation traffic to a stateless filter — only a stateful firewall, which keeps a table of established connections, can see that no such connection exists.'}]
    },
    {
      id:'ans1-ids', title:'IDS vs IPS — placement, action, and the cost of being wrong',
      def:'An IDS (Intrusion Detection System) observes traffic and raises an alert. An IPS (Intrusion Prevention System) sits in the traffic path and blocks it. Detection versus prevention is the whole difference and it is the most commonly asked comparison in this module.',
      table:{head:['','IDS','IPS'],rows:[
        ['Action','Detects and alerts only','Detects and actively blocks/drops'],
        ['Placement','Out-of-band — on a SPAN/mirror port, sees a copy','In-line — all traffic passes through it'],
        ['Response','Passive; a human decides what to do','Automatic; drops, resets, or quarantines'],
        ['Impact on traffic','None — cannot introduce latency or an outage','Adds latency; a failure or false positive can drop legitimate traffic'],
        ['Cost of a false positive','A noisy alert','A real user is cut off']
      ]},
      points:[
        '<b>NIDS (Network-based)</b> — deployed at a network choke point, watches traffic for many hosts. Sees the network but not what happens inside an encrypted session or on the host itself.',
        '<b>HIDS (Host-based)</b> — an agent on a single machine watching system calls, file integrity, logs and registry. Sees what the host does even when the traffic was encrypted, but only for that one host.',
        '<b>Signature-based detection</b> — matches traffic against a database of known attack patterns. Very low false-positive rate, very fast. <b>Limitation:</b> blind to zero-days and to any variant not yet in the database; requires constant signature updates.',
        '<b>Anomaly-based detection</b> — builds a statistical baseline of "normal" and flags deviation. Can catch novel attacks. <b>Limitation:</b> high false-positive rate; the baseline period can be poisoned if the network was already compromised while it learned.',
        '<b>Tools:</b> <b>Snort</b> — the open-source reference, rule-based, can run as IDS or inline IPS. <b>Suricata</b> — open-source, multi-threaded so it scales to higher throughput, and does file extraction and TLS logging. <b>Cisco IPS / Firepower</b> — commercial, integrated with the wider Cisco security fabric.'
      ],
      extra:[
        'Add <b>hybrid detection</b>: real deployments run signature and anomaly engines together, signatures for the known, anomaly for the new — and increasingly a third, <b>stateful protocol analysis</b>, which compares traffic against a vendor-supplied model of how the protocol is *supposed* to behave.',
        'Name the four outcomes and you can talk about tuning credibly: true positive, false positive, true negative, <b>false negative</b> — and note that the false negative is the dangerous one, because nobody ever gets an alert about it.',
        '<b>WIPS</b> (Wireless IPS) is the wireless-specific cousin — it detects rogue APs, honeypots and deauth floods. Cisco Adaptive Wireless IPS, Extreme AirDefense, WatchGuard WIPS and Aruba RFProtect are the named products in your slides.',
        'Real-world use cases from the deck: detecting port scans and reconnaissance, catching malware beaconing to C2, blocking SQL injection at the perimeter, and satisfying compliance requirements (PCI-DSS explicitly requires IDS/IPS).'
      ],
      trap:['"IDS is placed in-line" is the classic wrong answer. It is <b>out-of-band</b> — that is precisely why it cannot block, and precisely why it can never take the network down.'],
      mnem:['<b>D</b>etect = <b>D</b>etective (after the fact). <b>P</b>revent = <b>P</b>oliceman (in the way).']
    },
    {
      id:'ans1-vpn', title:'VPN — definition, purpose, and how the tunnel actually works',
      def:'A VPN (Virtual Private Network) extends a private network across a public network, letting a user send and receive data as if their device were directly attached to the private network — by encrypting the traffic and encapsulating it inside another packet.',
      points:[
        '<b>Purpose:</b> confidentiality on untrusted networks, remote access to internal resources, bypassing location restrictions, hiding the source IP from the destination, and joining two physically separate offices into one logical network.',
        '<b>How it works — the five steps:</b> (1) the client authenticates to the VPN gateway; (2) the two negotiate a shared session key; (3) each outbound packet is encrypted; (4) the encrypted packet is <i>encapsulated</i> inside a new outer packet addressed to the gateway — this is the tunnel; (5) the gateway decapsulates, decrypts, and forwards the original packet onto the internal network. The reply follows the reverse path.',
        '<b>Remote Access VPN</b> — one user to a corporate network. Use case: working from home, a laptop in a café.',
        '<b>Site-to-Site VPN</b> — gateway to gateway, joining two whole networks. Sub-types: <i>intranet</i> (two offices of one company), <i>extranet</i> (your network to a partner\'s). Users are unaware it exists.',
        '<b>Mobile VPN</b> — designed for endpoints whose IP address and network change mid-session (moving between cell towers and Wi-Fi). It keeps the session alive across the change rather than dropping it.',
        '<b>Cloud VPN / VPNaaS</b> — the gateway is hosted by a cloud provider, connecting users or on-prem networks to cloud workloads without any on-site hardware.'
      ],
      table:{head:['Protocol','Security','Speed','Stability','Compatibility'],rows:[
        ['<b>PPTP</b>','Weak — MS-CHAPv2 is broken; considered obsolete','Very fast','Good','Universal (legacy)'],
        ['<b>L2TP/IPsec</b>','Good — L2TP has no encryption of its own, IPsec supplies it','Moderate (double encapsulation)','Good','Very wide, built into most OSes'],
        ['<b>OpenVPN</b>','Excellent — SSL/TLS, AES-256, open source and audited','Good','Excellent, traverses NAT and firewalls on port 443','Needs a client app'],
        ['<b>IKEv2/IPsec</b>','Excellent','Very fast','Excellent — best at reconnecting after a network change (MOBIKE)','Native on iOS/Windows; the usual mobile-VPN choice'],
        ['<b>WireGuard</b>','Excellent — modern, fixed cipher suite (ChaCha20, Curve25519)','Fastest','Excellent','Growing; ~4,000 lines of code vs IPsec\'s ~400,000']
      ]},
      extra:[
        'The small code-base of WireGuard is a security argument, not a performance one: a smaller attack surface is easier to audit exhaustively. Say that and you have made the point the slide implies.',
        '<b>IPsec has two modes.</b> <i>Transport mode</i> encrypts only the payload, leaving the original IP header — used host-to-host. <i>Tunnel mode</i> encrypts the entire original packet and wraps it in a new header — used gateway-to-gateway, and it is what hides the internal addressing. Site-to-site VPNs are tunnel mode.',

      id:'ans1-krack', title:'KRACK — Key Reinstallation Attack (case study, near-certain question)',

    {
      id:'ans2-zt', title:'Zero Trust — the principles and the NIST tenets',
      def:'Zero Trust is a security model that eliminates implicit trust and requires continuous verification of every access request, regardless of where it originates or what resource it targets. Defined formally in NIST SP 800-207.',

SUBJECT.modules.push({
  title: 'IAM and Authentication Fundamentals',
  short: 'IAM & AuthN',
  weight: '20%',
  intro: 'Identity is the new perimeter — this module is the "IAM" half of the course title. Expanded from the standard syllabus; check against your Module III deck when it is released.',
  topics: [
    {
      id:'ans3-iam', title:'IAM — the four A\'s and the identity lifecycle',
      def:'Identity and Access Management is the framework of policies and technologies ensuring that the right individuals access the right resources at the right times for the right reasons.',
      points:[
        '<b>Identification</b> — claiming an identity (a username). No proof yet.',
        '<b>Authentication</b> — proving the claim. "Are you who you say you are?"',
        '<b>Authorization</b> — deciding what that proven identity may do. "What are you allowed to touch?"',
        '<b>Accounting / Auditing</b> — recording what they did. Non-repudiation lives here.',
        '<b>Identity lifecycle:</b> <i>provisioning</i> (joiner) → <i>modification</i> (mover — role change) → <i>de-provisioning</i> (leaver). The Colonial Pipeline breach is a de-provisioning failure.',
        '<b>Privilege creep</b> — a "mover" who accumulates the permissions of every role they have ever held because nothing was ever revoked. Countered by <b>access recertification</b> / periodic access review.',
        '<b>PAM (Privileged Access Management)</b> — separate, heavily controlled handling of admin accounts: credential vaulting, session recording, just-in-time elevation, and break-glass procedures.'
      ],
      extra:[
        '<b>SoD — Separation of Duties.</b> No single person should be able to both create a payment and approve it. IAM enforces this as a toxic-combination rule at role-assignment time.',
        '<b>Access models, all four:</b> <b>DAC</b> (owner decides — file permissions), <b>MAC</b> (system-enforced labels — military classification), <b>RBAC</b> (permissions attached to roles, users to roles), <b>ABAC</b> (policy evaluated over attributes of subject, object, action and environment — the most expressive, and what Zero Trust policy engines actually use).',
        '<b>Zero standing privilege</b> is the modern goal: nobody holds admin rights at rest; they are granted just-in-time, for a fixed window, with an approval trail.'
      ]
    },
    {
      id:'ans3-auth', title:'Authentication factors, MFA, and why SMS is the weak one',
      points:[
        '<b>The three classical factors:</b> something you <b>know</b> (password, PIN), something you <b>have</b> (token, phone, smartcard), something you <b>are</b> (fingerprint, face, iris). Sometimes extended with somewhere you <b>are</b> (geolocation) and something you <b>do</b> (behavioural biometrics — typing rhythm, gait).',
        '<b>MFA requires factors from different categories.</b> A password plus a security question is <i>not</i> MFA — both are "something you know".',
        '<b>OTP / TOTP</b> — Time-based One-Time Password (RFC 6238): a shared secret plus the current 30-second time window, hashed with HMAC-SHA1. HOTP is the counter-based variant.',
        '<b>SMS OTP is the weakest second factor</b> — vulnerable to SIM swapping, SS7 interception and simple social engineering of the carrier. NIST has deprecated it for high-assurance use.',
        '<b>FIDO2 / WebAuthn / passkeys</b> — public-key authentication where the private key never leaves the authenticator and the signature is bound to the origin domain. This makes it <b>structurally phishing-resistant</b>: a fake site gets a signature that is invalid for its own domain.',
        '<b>Biometrics metrics:</b> FAR (False Accept Rate — a stranger let in, the security failure), FRR (False Reject Rate — the real user locked out, the usability failure), and CER/EER, the crossover point where the two are equal, used to compare systems. Biometrics cannot be revoked — a leaked fingerprint is leaked forever.',
        '<b>Adaptive / risk-based authentication</b> — step up the requirement only when the context is unusual (new device, impossible travel, unusual hour). This is the authentication half of Zero Trust\'s "verify explicitly".'
      ],
      extra:[
        '<b>Password storage is a favourite question.</b> Never store plaintext, never plain SHA-256. Use a slow, memory-hard KDF with a per-user <b>salt</b>: <b>bcrypt, scrypt, Argon2, PBKDF2</b>. Salt defeats rainbow tables; the deliberate slowness defeats GPU brute force; a <b>pepper</b> (a secret held outside the database) defeats an attacker who has only the database dump.',
        '<b>MFA fatigue / push bombing</b> — spamming push approvals until the user taps yes. Countered by <b>number matching</b>. This is a current, real attack and naming it is a mark.',
        '<b>Kerberos in three lines:</b> the client gets a Ticket Granting Ticket from the Authentication Server, presents the TGT to the Ticket Granting Server for a service ticket, and presents the service ticket to the service. The password never crosses the network, and timestamps prevent replay — which is why Kerberos is exquisitely sensitive to clock skew (5 minutes by default).'
      ],
      trap:['Two-factor means two <b>different</b> categories. Password + security question = single-factor. Password + fingerprint = two-factor.'],
      qa:[{q:'Why is WebAuthn phishing-resistant when TOTP is not?',a:'A TOTP code is a shared secret the user can be tricked into typing into any site, and it is valid anywhere for 30 seconds. WebAuthn signs a challenge with a private key that never leaves the device, and the signature is cryptographically bound to the origin (the real domain). A phishing site receives a signature that its own domain cannot validate, so the credential is useless to it.'}]
    },
    {
      id:'ans3-fed', title:'Federation — SSO, SAML, OAuth 2.0 and OpenID Connect',
      points:[
        '<b>SSO (Single Sign-On)</b> — authenticate once to an Identity Provider, then access many Service Providers without re-entering credentials. Improves usability <i>and</i> security (fewer passwords, one place to enforce MFA and to revoke), but concentrates risk: the IdP becomes a single point of failure and a very high-value target.',
        '<b>SAML 2.0</b> — XML-based. The IdP issues a signed <i>assertion</i> about the user; the SP consumes it. Dominant in enterprise and university web SSO.',
        '<b>OAuth 2.0 is authorization, not authentication.</b> It issues an access token letting an application act on a resource on the user\'s behalf, with a limited <i>scope</i>. It says nothing reliable about who the user is.',
        '<b>OpenID Connect (OIDC)</b> is the thin identity layer on top of OAuth 2.0. It adds the <b>ID token</b> — a signed JWT containing claims about the user. "Sign in with Google" is OIDC, not bare OAuth.',
        '<b>JWT structure:</b> header.payload.signature, base64url-encoded and dot-separated. The payload is <b>readable by anyone</b> — it is encoded, not encrypted — so never put a secret in it. The signature is what makes it trustworthy.'
      ],
      extra:[
        '<b>The classic JWT vulnerability:</b> accepting <code>alg: none</code>, or allowing an algorithm switch from RS256 to HS256 so the attacker signs the token with the public key as the HMAC secret. Always pin the expected algorithm server-side.',
        '<b>OAuth roles, all four:</b> Resource Owner (the user), Client (the app), Authorization Server (issues tokens), Resource Server (holds the API). The <b>Authorization Code flow with PKCE</b> is the only one you should recommend today — implicit flow is deprecated because the token travels in the URL fragment.',
        '<b>SCIM</b> — System for Cross-domain Identity Management: the standard for <i>provisioning</i> accounts between systems, the automation that makes joiner/mover/leaver actually happen. Federation handles login; SCIM handles the account existing at all.'
      ],
      trap:['If an exam question says "use OAuth to log the user in", the correct answer is that OAuth 2.0 alone is an authorization framework and <b>OpenID Connect</b> is the authentication layer built on it.']
    }
  ]
});

SUBJECT.modules.push({
  title: 'Secure Coding',
  short: 'Secure Coding',
  weight: '20%',
  intro: 'Standard-syllabus expansion — align with your Module IV deck when released. The OWASP Top 10 and the classic memory-safety bugs are the reliable core.',
  topics: [
    {
      id:'ans4-owasp', title:'OWASP Top 10 and the injection family',
      points:[
        '<b>The 2021 OWASP Top 10, in order:</b> A01 Broken Access Control, A02 Cryptographic Failures, A03 Injection, A04 Insecure Design, A05 Security Misconfiguration, A06 Vulnerable and Outdated Components, A07 Identification and Authentication Failures, A08 Software and Data Integrity Failures, A09 Security Logging and Monitoring Failures, A10 Server-Side Request Forgery.',
        '<b>SQL injection</b> — untrusted input concatenated into a query changes its structure. <b>The fix is parameterised queries / prepared statements</b>, which send code and data on separate channels so data can never be parsed as code. Input validation and escaping are defence in depth, not the fix.',
        '<b>XSS (Cross-Site Scripting)</b> — attacker script executes in the victim\'s browser in the site\'s origin. Three types: <i>stored</i> (persisted on the server), <i>reflected</i> (echoed back from the request), <i>DOM-based</i> (never touches the server; the sink is in client-side JS). Fix: contextual output encoding, a Content-Security-Policy, and <code>HttpOnly</code> cookies so a stolen script cannot read the session.',
        '<b>CSRF</b> — the victim\'s browser is tricked into sending an authenticated request the user did not intend. Fix: anti-CSRF tokens and <code>SameSite</code> cookies.',
        '<b>Broken access control</b> — including <b>IDOR</b> (Insecure Direct Object Reference): changing <code>/invoice?id=101</code> to <code>102</code> and getting someone else\'s data. Authorisation must be checked <b>server-side, on every request</b>, against the authenticated identity.',
        '<b>Buffer overflow</b> — writing past the end of a buffer overwrites adjacent memory, classically the saved return address on the stack, redirecting execution to attacker-supplied shellcode. Caused by unbounded functions like <code>strcpy</code>, <code>gets</code>, <code>sprintf</code>. Fix: bounded alternatives (<code>strncpy</code>, <code>snprintf</code>), and memory-safe languages.',
        '<b>Mitigations at the platform level:</b> <b>ASLR</b> (randomises memory layout so addresses cannot be predicted), <b>DEP/NX</b> (marks the stack non-executable), <b>stack canaries</b> (a known value before the return address; if it changed, abort), and compiler hardening flags.'
      ],
      extra:[
        '<b>The one-line principle that answers half of secure coding: never mix code and data.</b> SQL injection, XSS, command injection, LDAP injection and template injection are all the same bug — a parser being handed attacker-controlled input as instructions.',
        '<b>Race conditions / TOCTOU</b> (Time Of Check to Time Of Use): a resource is validated and then used, and the attacker changes it in between. Fix with atomic operations and locking, not with re-checking.',
        '<b>Secure SDLC</b> — shift left. Threat modelling at design (<b>STRIDE</b>: Spoofing, Tampering, Repudiation, Information disclosure, Denial of service, Elevation of privilege), <b>SAST</b> on source, <b>DAST</b> against a running app, <b>SCA</b> for third-party dependencies, then penetration testing. Name the four tool categories and you have covered the whole pipeline.',
        '<b>Fail securely, and fail closed.</b> An error handler that grants access on exception is a vulnerability; and error messages must never leak stack traces, SQL text or internal paths.'
      ],
      trap:['Input <b>validation</b> alone does not stop SQL injection — blacklists are always incomplete. Parameterised queries stop it structurally, which is why they are the answer.'],
      mnem:['OWASP injection triad by fix: <b>SQLi → parameterise. XSS → encode on output. CSRF → token + SameSite.</b>']
    }
  ]
});

      table:{head:['','IT','OT'],rows:[

SUBJECT.quiz = [
  {q:'Compare IDS and IPS across action, placement and impact.',a:'IDS detects and alerts, sits out-of-band on a mirror port, and has no impact on traffic — a false positive is only noise. IPS detects and blocks, sits in-line so all traffic passes through it, adds latency, and a false positive cuts off a legitimate user. IDS is a detective control; IPS is a preventive one.'},
  {q:'Explain the WPA2 four-way handshake and how KRACK subverts it.',a:'AP sends ANonce; client replies with SNonce and a MIC; AP sends message 3 containing the group key and the instruction to install the PTK; client acknowledges. Message 3 may be retransmitted if the ack is lost, and each receipt causes the client to reinstall the key, resetting the nonce and replay counter. KRACK sits as a MITM, blocks message 4, and replays message 3 — forcing nonce reuse, which yields keystream reuse and allows decryption (and, against some Android/wpa_supplicant versions that install an all-zero key, injection).'},
  {q:'Why does WPA3 resist offline dictionary attacks when WPA2-PSK does not?',a:'WPA2-PSK lets an attacker capture the four-way handshake once and then test passphrase guesses offline, at unlimited speed. WPA3 replaces it with SAE (Dragonfly), a password-authenticated key exchange in which the captured exchange yields nothing testable — every guess requires a fresh live interaction with the AP, which is rate-limited and detectable. SAE also provides forward secrecy, so a later passphrase compromise does not decrypt past traffic.'},
  {q:'Contrast tunnel mode and transport mode in IPsec.',a:'Transport mode encrypts only the IP payload and keeps the original header, so it is used host-to-host and the endpoints\' addresses remain visible. Tunnel mode encrypts the entire original packet and encapsulates it in a new IP header addressed to the gateways, hiding internal addressing — this is what site-to-site VPNs use.'},
  {q:'Why did the perimeter security model fail, and what replaces it?',a:'It grants implicit trust by network location, so one breach permits free lateral movement; it has no view of insiders; and the perimeter itself has dissolved with cloud, SaaS and remote work, so the data is no longer inside the wall. Zero Trust replaces it: verify explicitly on every request using identity, device posture and context; grant least privilege just-in-time; assume breach and micro-segment to limit blast radius.'},
  {q:'Distinguish authentication, authorization and accounting with an example.',a:'Authentication proves identity — the password and passkey at login. Authorization decides what that identity may do — this user may read the payroll report but not edit it. Accounting records what was done — an audit log entry showing the report was opened at 14:02, which supplies non-repudiation.'},
  {q:'How do you defend against SQL injection, and why is input validation insufficient?',a:'Use parameterised queries or prepared statements so the SQL structure is fixed by the developer and user input can only ever be bound as data, never parsed as code. Input validation relies on enumerating bad patterns, and blacklists are always incomplete — encoding tricks, alternate character sets and second-order injection defeat them. Validation, least-privilege database accounts and a WAF are defence in depth on top of parameterisation, not substitutes for it.'},
  {q:'Why is the CIA triad reordered in OT environments?',a:'Because OT controls a physical process. Loss of availability in an ICS can mean an uncontrolled shutdown, equipment destruction, environmental release or injury, so availability comes first, then integrity (a falsified sensor reading causes a wrong control action), and confidentiality last — the setpoint of a valve is rarely a secret worth an outage.'},
  {q:'What is a honeypot AP and how does it differ from a rogue AP?',a:'A honeypot AP broadcasts several attractive, commonly-saved SSIDs so passing clients associate automatically and route their traffic through the attacker. A rogue AP is an unauthorised access point physically connected to the organisation\'s own wired network, usually by an employee, which bypasses the perimeter from inside. The honeypot is countered by mutual authentication and by not auto-joining open networks; the rogue AP is found by wireless IPS scanning and by port security on the switch.'},
  {q:'Give three countermeasures for wireless attacks and justify each.',a:'Deploy WPA3 or WPA2-Enterprise with 802.1X rather than a shared PSK, so credentials are per-user, revocable, and there is no single handshake worth capturing. Enable Protected Management Frames (802.11w), which authenticates deauthentication frames and therefore breaks the deauth flood that both the Aircrack-ng handshake capture and evil-twin herding depend on. Place a firewall between the AP and the corporate intranet and run a WIPS, so that even a successful wireless compromise lands in a segmented zone and a rogue or honeypot AP is detected rather than trusted.'}
];

<script>
/* ==================================================================
   RENDERER — one template, driven by the SUBJECT object above it.
   Every subject file is this same code with a different SUBJECT, so a
   fix here is a fix everywhere and the three files never drift apart.
   State (checkboxes, open module) is namespaced by SUBJECT.slug, so
   ticking a Blockchain topic never lights up an IoT one.
   ================================================================== */
(function(){
  var S = window.SUBJECT;
  var KEY = 'p1study:' + S.slug;
  var done = {};              // topicId -> true
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ done = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }

  document.title = 'PLAYER ONE — ' + S.name;
  // Short label only. The hero heading below already carries the full name and
  // code; repeating them here is what pushed the bar past the viewport width.
  document.getElementById('brand').innerHTML = '▮ <b>' + esc(S.short || S.name) + '</b>';

  // ---- flatten topics for search/progress ----
  var allTopics = [];
  S.modules.forEach(function(m){ (m.topics||[]).forEach(function(t){ allTopics.push(t); }); });

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  // ---------------- sidebar ----------------
  function buildSide(){
    var el = document.getElementById('side');
    var h = '<div class="tochead">'+esc(S.name)+'</div>';
    h += '<button class="tocmod" onclick="scrollToId(\'top\')"><span class="n">▸</span>Overview &amp; exam plan</button>';
    S.modules.forEach(function(m,i){
      h += '<button class="tocmod" data-mod="'+i+'" onclick="openMod('+i+',true)">'
         + '<span class="n">M'+(i+1)+'</span>'+esc(m.short||m.title)
         + '<span class="pc" id="pc'+i+'"></span></button>';
    });
    if(S.exam){
      h += '<div class="tochead">Self-test</div>';
      h += '<button class="tocmod" onclick="scrollToId(\'quiz\')"><span class="n">?</span>Likely questions</button>';
    }
    el.innerHTML = h;
  }

  // ---------------- topic renderer ----------------
  function renderTopic(t){
    var cls = 'topic' + (done[t.id]?' done':'');
    var h = '<div class="'+cls+'" id="'+t.id+'" data-topic="1">';
    h += '<h3><input type="checkbox" class="chk" '+(done[t.id]?'checked':'')
       + ' onchange="toggleTopic(\''+t.id+'\',this.checked)"><span>'+esc(t.title)+'</span>';
    if(t.tag==='min') h += '';
    h += '</h3>';
    if(t.def) h += '<div class="def">'+t.def+'</div>';
    if(t.points && t.points.length){
      h += '<ul class="pts">';
      t.points.forEach(function(p){ h += '<li>'+p+'</li>'; });
      h += '</ul>';
    }
    if(t.table) h += renderTable(t.table);
    if(t.extra) h += box('extra','EXTRA MARKS ✦', t.extra);
    if(t.trap)  h += box('trap','EXAM TRAP ⚠', t.trap);
    if(t.mnem)  h += box('mnem','REMEMBER IT ◆', t.mnem);
    if(t.qa && t.qa.length){
      t.qa.forEach(function(q){
        h += '<div class="qa" onclick="this.classList.toggle(\'open\')">'
           + '<div class="qq"><span class="m">Q</span><span>'+esc(q.q)+'</span></div>'
           + '<div class="aa">'+q.a+'</div></div>';
      });
    }
    h += '</div>';
    return h;
  }
  function box(cls,label,body){
    var inner = Array.isArray(body)
      ? '<ul>'+body.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
      : '<div>'+body+'</div>';
    return '<div class="box '+cls+'"><div class="bh">'+label+'</div>'+inner+'</div>';
  }
  function renderTable(tb){
    var h = '<table><thead><tr>';
    tb.head.forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    tb.rows.forEach(function(r){
      h += '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';
    });
    h += '</tbody></table>';
    return h;
  }

  // ---------------- main ----------------
  function buildMain(){
    var el = document.getElementById('main');
    var h = '';
    h += '<div class="hero" id="top">'
       + '<div class="code">'+esc(S.code)+' · MINOR EXAM · '+esc(S.examLabel||'')+'</div>'
       + '<h1>'+esc(S.name)+'</h1>'
       + '<p>'+esc(S.blurb||'')+'</p>';
    if(S.plan){
      h += '<div class="box extra" style="margin-bottom:0"><div class="bh">HOW TO USE THIS ✦</div><ul>'
         + S.plan.map(function(x){return '<li>'+x+'</li>';}).join('') + '</ul></div>';
    }
    h += '</div>';

    S.modules.forEach(function(m,i){
      h += '<section class="mod" id="mod'+i+'" data-mod="'+i+'">';
      h += '<div class="modhead" onclick="openMod('+i+')">'
         + '<span class="caret">▶</span>'
         + '<h2><span style="color:var(--ink-3)">M'+(i+1)+'</span> &nbsp;'+esc(m.title)+'</h2>';
      if(m.weight) h += '<span class="wt">'+esc(m.weight)+'</span>';
      h += '</div>';
      h += '<div class="modbody">';
      if(m.intro) h += '<p style="color:var(--ink-2);font-size:12.5px;margin:8px 0 2px">'+m.intro+'</p>';
      (m.topics||[]).forEach(function(t){ h += renderTopic(t); });
      h += '</div></section>';
    });

    if(S.quiz && S.quiz.length){
      h += '<section class="mod open" id="quiz"><div class="modhead"><span class="caret">▶</span>'
         + '<h2><span style="color:var(--ink-3)">✱</span> &nbsp;Most likely questions — rapid self-test</h2></div>';
      h += '<div class="modbody">';
      h += '<p style="color:var(--ink-2);font-size:12.5px">Tap to reveal. If you can answer these cold, you are ready.</p>';
      S.quiz.forEach(function(q){
        h += '<div class="qa" onclick="this.classList.toggle(\'open\')">'
           + '<div class="qq"><span class="m">Q</span><span>'+esc(q.q)+'</span></div>'
           + '<div class="aa">'+q.a+'</div></div>';
      });
      h += '</div></section>';
    }

    h += '<div class="foot">'+ (S.foot||'') +'<br>Generated for Neel · PLAYER ONE life-dashboard · offline-ready, no network calls. '
       + 'Progress is saved on this device. Print to PDF for a paper copy.</div>';
    el.innerHTML = h;
  }

  // ---------------- interactions ----------------
  window.openMod = function(i, fromNav){
    var mod = document.getElementById('mod'+i);
    if(!mod) return;
    if(fromNav){ mod.classList.add('open'); }
    else { mod.classList.toggle('open'); }
    document.querySelectorAll('.tocmod[data-mod]').forEach(function(b){
      b.classList.toggle('on', +b.getAttribute('data-mod')===i);
    });
    if(fromNav){ mod.scrollIntoView({behavior:'smooth',block:'start'}); closeSideMobile(); }
    updateRail();
  };
  window.expandAll = function(on){
    document.querySelectorAll('.mod').forEach(function(m){ if(m.id!=='quiz') m.classList.toggle('open',on); });
    updateRail();
  };
  window.toggleTopic = function(id,val){
    if(val) done[id]=true; else delete done[id];
    save();
    var t=document.getElementById(id); if(t) t.classList.toggle('done',!!val);
    updateProgress();
  };
  window.scrollToId = function(id){ var e=document.getElementById(id); if(e){e.scrollIntoView({behavior:'smooth',block:'start'});} closeSideMobile(); };
  window.jumpNext = function(){
    for(var i=0;i<S.modules.length;i++){
      var ts=S.modules[i].topics||[];
      var undoneLeft = ts.some(function(t){return !done[t.id];});
      if(undoneLeft){ openMod(i,true); return; }
    }
    scrollTo(0,0);
  };
  window.toggleSide = function(){
    document.getElementById('side').classList.toggle('open');
    document.getElementById('scrim').classList.toggle('on');
  };
  function closeSideMobile(){
    if(window.innerWidth<=900){
      document.getElementById('side').classList.remove('open');
      document.getElementById('scrim').classList.remove('on');
    }
  }
  window.toggleCRT = function(){ document.body.classList.toggle('plain'); };

  // ---------------- progress ----------------
  function updateProgress(){
    var total=allTopics.length, n=0;
    allTopics.forEach(function(t){ if(done[t.id]) n++; });
    var pct = total? Math.round(n/total*100):0;
    document.getElementById('pcnt').textContent = pct+'%';
    document.getElementById('railfill').style.width = pct+'%';
    S.modules.forEach(function(m,i){
      var ts=m.topics||[], mn=0; ts.forEach(function(t){ if(done[t.id]) mn++; });
      var el=document.getElementById('pc'+i);
      if(el) el.textContent = ts.length? (mn+'/'+ts.length):'';
    });
  }
  function updateRail(){ /* rail reflects scroll depth on wide screens */ }

  // ---------------- search ----------------
  var qEl = document.getElementById('q');
  var timer=null;
  qEl.addEventListener('input', function(){
    clearTimeout(timer); timer=setTimeout(function(){ runSearch(qEl.value.trim().toLowerCase()); },120);
  });
  function runSearch(term){
    var main=document.getElementById('main');
    var old=document.getElementById('nores'); if(old) old.remove();
    if(!term){
      document.querySelectorAll('[data-topic]').forEach(function(t){ t.classList.remove('hidden'); unmark(t); });
      document.querySelectorAll('.mod').forEach(function(m){ m.classList.remove('hidden'); });
      return;
    }
    var hits=0;
    document.querySelectorAll('.mod').forEach(function(m){
      if(m.id==='quiz'){ m.classList.add('hidden'); return; }
      var any=false;
      m.querySelectorAll('[data-topic]').forEach(function(t){
        var txt=t.textContent.toLowerCase();
        var match=txt.indexOf(term)>=0;
        t.classList.toggle('hidden',!match);
        if(match){ any=true; hits++; }
      });
      m.classList.toggle('hidden',!any);
      if(any) m.classList.add('open');
    });
    if(!hits){
      var d=document.createElement('div'); d.id='nores';
      d.textContent='No topic mentions “'+term+'”. Try a shorter word.';
      main.appendChild(d);
    }
  }
  function unmark(){}

  // keyboard: "/" focuses search
  document.addEventListener('keydown',function(e){
    if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
    if(e.key==='Escape'){ qEl.value=''; runSearch(''); qEl.blur(); }
  });

  // ---------------- boot ----------------
  buildSide(); buildMain(); updateProgress();
  if(S.modules[0]) document.getElementById('mod0').classList.add('open');
})();
</script>
</body>
</html>
