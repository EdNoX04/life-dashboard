SUBJECT.modules.push({
  title: 'Embedded Systems and the IoT',
  short: 'Embedded & IoT',
  weight: '25%',
  intro: 'The conceptual module: what an embedded system is, what makes it an IoT system, the layered architecture, and the protocol stack. Definitions and the layer diagram are near-certain.',
  topics: [
    {
      id:'iot1-embed', title:'Embedded systems — definition, characteristics, classification',
      def:'An embedded system is a combination of computer hardware and software designed to perform a specific, dedicated function within a larger mechanical or electrical system — usually with real-time constraints, and usually invisible to the user as a "computer".',
      points:[
        '<b>Characteristics:</b> single-functioned (does one job for its whole life), tightly constrained (cost, power, memory, size), reactive and real-time, often with no operating system or with an RTOS, and typically running from ROM/flash rather than disk.',
        '<b>Classification by performance:</b> <i>small scale</i> (8-bit MCU, a few KB RAM), <i>medium scale</i> (16/32-bit, RTOS), <i>sophisticated</i> (multiple processors, custom ASIC/FPGA).',
        '<b>Classification by timing:</b> <b>hard real-time</b> — a missed deadline is a system failure (airbag, engine ignition, pacemaker); <b>soft real-time</b> — a missed deadline degrades quality (video streaming, a thermostat).',
        '<b>Microprocessor vs microcontroller</b> — the most-asked comparison in this module. A microprocessor is a CPU alone and needs external RAM, ROM and I/O; a microcontroller integrates CPU, RAM, flash, timers, ADC and GPIO on one chip. MPU = general-purpose and high-performance; MCU = dedicated, low-power, low-cost.',
        '<b>Components of an embedded system:</b> processor/MCU, memory (flash for program, SRAM for data, EEPROM for persistent settings), input devices (sensors), output devices (actuators, displays), communication interfaces (UART, I²C, SPI), and the power supply.',
        '<b>Sensor vs actuator, and transducer:</b> a <b>sensor</b> converts a physical quantity into an electrical signal (input); an <b>actuator</b> converts an electrical signal into physical action (output). A <b>transducer</b> is the umbrella term for either.'
      ],
      extra:[
        '<b>Von Neumann vs Harvard architecture</b> — Von Neumann shares one bus for instructions and data (simpler, but a bottleneck); Harvard uses separate buses so an instruction fetch and a data access happen simultaneously. <b>AVR (Arduino) is Harvard; ARM Cortex-A (Raspberry Pi) is a modified Harvard.</b> This explains why you cannot simply read program memory as data on an Arduino without <code>PROGMEM</code>.',
        '<b>Watchdog timer</b> — a hardware counter that resets the MCU unless the software periodically "kicks" it. It is how an unattended embedded system recovers from a software hang, and naming it is a strong reliability point.',
        '<b>RTOS concepts:</b> deterministic scheduling, task priorities, pre-emption, and priority inversion (a low-priority task holding a resource a high-priority task needs — solved by priority inheritance). FreeRTOS is the one to name.',
        '<b>ADC resolution matters and is examinable arithmetic:</b> an n-bit ADC divides its reference into 2ⁿ steps. Arduino Uno is 10-bit over 5 V → 1024 steps → 4.88 mV per step. ESP8266 is 10-bit over 1.0 V. The Raspberry Pi has <b>no ADC at all</b> — that is a favourite question.'

      def:'The Internet of Things is a network of physical objects embedded with sensors, software and connectivity that collect and exchange data over the internet, enabling remote monitoring and control without human intervention.',
      points:[
        '<b>The four-layer model (learn this one):</b> <b>(1) Perception / Sensing layer</b> — sensors, actuators, RFID, the physical devices. <b>(2) Network / Transport layer</b> — gateways and connectivity (Wi-Fi, ZigBee, LoRa, cellular) moving data upward. <b>(3) Processing / Middleware layer</b> — data storage, filtering, analytics, device management, often cloud. <b>(4) Application layer</b> — the end-user service: smart home app, dashboard, alerting.',
        '<b>The three-layer model</b> collapses processing into network: Perception → Network → Application. Some texts add a fifth <b>Business layer</b> above Application for models and decision-making.',
        '<b>IoT gateway</b> — bridges local device protocols (ZigBee, BLE, Modbus) to IP, performs protocol translation, local filtering and buffering, and enforces security at the edge. It is the single most important component in a real deployment.',
        '<b>Edge / fog computing</b> — processing near the source rather than in the cloud. <i>Why:</i> lower latency (a safety cutoff cannot wait for a round trip), bandwidth cost (do not stream raw vibration data to send one alert), privacy (raw video never leaves the building), and continued operation when the link drops.',
        '<b>Characteristics of IoT:</b> connectivity, heterogeneity, dynamic scale, self-configuration, unique identity per device, safety and security, and the generation of enormous data volumes.',

      extra:[
        '<b>The M2M vs IoT distinction</b> is a common short question: M2M is typically point-to-point, over a dedicated or cellular link, with hardware-specific integration and one application. IoT is IP-based, many-to-many, cloud-mediated, and designed for data to be reused by applications the device manufacturer never anticipated.',
        '<b>Six-layer / reference architectures</b> to name if asked for standards: the ITU-T Y.2060 reference model and the IoT-A architectural reference model.',
        '<b>Actuator examples with the right vocabulary:</b> relay (electrically isolated switch for mains loads), solenoid (linear motion), servo motor (position controlled by PWM pulse width), stepper motor (precise incremental rotation), and DC motor with an H-bridge for direction control.'

        ['<b>HTTP/REST</b>','Request/response','TCP','High (text headers)','Web integration, dashboards'],
        ['<b>AMQP</b>','Message queue','TCP','High','Enterprise messaging, guaranteed delivery'],
        ['<b>WebSocket</b>','Full duplex','TCP','Low after handshake','Live dashboards']
      ]},
      points:[
        '<b>MQTT is the one to know properly.</b> Publishers send to a <b>topic</b> on a <b>broker</b> (Mosquitto, HiveMQ); subscribers receive from topics they subscribe to. Publisher and subscriber never know about each other — <b>decoupling in space, time and synchronisation</b>.',
        '<b>MQTT QoS levels:</b> <b>0</b> — at most once, fire and forget. <b>1</b> — at least once, acknowledged, so duplicates are possible. <b>2</b> — exactly once, via a four-way handshake, the slowest.',

        '<b>CoAP</b> runs over UDP with optional reliability (CON/NON messages), uses the same verbs as HTTP (GET/POST/PUT/DELETE), and supports <b>observe</b> for push. Secured by <b>DTLS</b>, which is TLS adapted for datagrams.'
      ],

      extra:[

        '<b>IoT security, protocol-specific:</b> MQTT has no security of its own — you must run it over TLS (port 8883, not 1883) and use broker-side authentication and topic ACLs. An open Mosquitto broker on port 1883 is one of the most commonly found IoT vulnerabilities in the wild.'
      ],
      trap:['MQTT is <b>publish/subscribe through a broker</b>, not peer-to-peer. There is always a broker, and it is the single point of failure you must mention in any design answer.'],
      mnem:['<b>MQTT = TCP + broker + topics. CoAP = UDP + REST + tiny.</b>'],
      qa:[{q:'Why is MQTT preferred over HTTP for a battery-powered sensor?',a:'MQTT keeps one long-lived TCP connection with a 2-byte fixed header, so publishing a reading costs a handful of bytes; HTTP re-establishes a connection and sends hundreds of bytes of text headers per request. Radio transmission dominates the power budget of a battery sensor, so fewer bytes and fewer connection setups translate directly into battery life. MQTT is also push-capable — the server can reach the device without polling — and its Last Will feature reports device death, which HTTP polling can only infer from timeouts.'}]
    }
  ]

SUBJECT.modules.push({
  title: 'Raspberry Pi 3 Interfacing',

  intro: 'The hands-on module: GPIO in Python, the three serial buses, and wiring real sensors and actuators. Expect a code question — write real code, not pseudocode.',
  topics: [
    {
      id:'iot4-gpio', title:'GPIO programming in Python',
      points:[
        '<b>The canonical RPi.GPIO skeleton</b> — write it exactly:<br><code>import RPi.GPIO as GPIO</code><br><code>import time</code><br><code>GPIO.setmode(GPIO.BCM)</code><br><code>GPIO.setwarnings(False)</code><br><code>GPIO.setup(18, GPIO.OUT)</code><br><code>GPIO.setup(23, GPIO.IN, pull_up_down=GPIO.PUD_UP)</code><br><code>try:</code><br>&nbsp;&nbsp;<code>while True:</code><br>&nbsp;&nbsp;&nbsp;&nbsp;<code>GPIO.output(18, GPIO.HIGH)</code><br>&nbsp;&nbsp;&nbsp;&nbsp;<code>time.sleep(1)</code><br>&nbsp;&nbsp;&nbsp;&nbsp;<code>GPIO.output(18, GPIO.LOW)</code><br>&nbsp;&nbsp;&nbsp;&nbsp;<code>time.sleep(1)</code><br><code>finally:</code><br>&nbsp;&nbsp;<code>GPIO.cleanup()</code>',
        '<b><code>GPIO.cleanup()</code> matters</b> — it resets pins to inputs on exit. Without it a pin left driving HIGH can damage whatever it is connected to when the next program assumes a different configuration. Putting it in a <code>finally:</code> block is the correct pattern and is worth saying.',
        '<b>Input handling, three ways:</b> <i>polling</i> in a loop (simple, wastes CPU, can miss fast events); <b><code>GPIO.wait_for_edge(pin, GPIO.RISING)</code></b> (blocks efficiently until the edge); <b><code>GPIO.add_event_detect(pin, GPIO.FALLING, callback=fn, bouncetime=200)</code></b> (interrupt-driven callback with hardware debounce built in — this is the answer they want).',
        '<b>Software PWM:</b> <code>p = GPIO.PWM(18, 1000)</code> then <code>p.start(50)</code> and <code>p.ChangeDutyCycle(75)</code>. Note the limitation: it is generated in software by the Linux scheduler, so it jitters. Only GPIO12, 13, 18 and 19 have <b>hardware PWM</b>, which is stable enough for a servo.',
        '<b>Libraries:</b> <code>RPi.GPIO</code> (classic), <code>gpiozero</code> (modern, object-oriented — <code>LED(18).blink()</code>, <code>Button(23).when_pressed</code>), <code>pigpio</code> (daemon-based, gives precise hardware-timed PWM and servo control), and <code>smbus2</code> / <code>spidev</code> for the buses.'
      ],
      extra:[
        '<b>Driving anything real needs a driver stage.</b> A Pi GPIO can source about <b>16 mA</b> per pin with a <b>50 mA total</b> across all pins. So: an LED with a resistor is fine; a relay module, motor or LED strip needs a transistor/MOSFET or a driver IC (ULN2003, L298N for motors) with a separate supply and a <b>common ground</b>. Forgetting the shared ground is the most common lab failure and a very quotable answer.',

      table:{head:['','I²C','SPI','UART'],rows:[

        ['Type','Synchronous, shared bus','Synchronous, master/slave','<b>Asynchronous</b>'],

        ['Typical use','Sensors, RTC, EEPROM, OLED','SD card, display, ADC, high-rate sensors','GPS, GSM modem, debug console']

      points:[
        '<b>I²C</b> — two wires shared by every device, each with a unique 7-bit address. <b>Both lines need pull-up resistors</b> (typically 4.7 kΩ; the Pi has 1.8 kΩ pull-ups on GPIO2/3 already). Master initiates with a START condition, sends address + R/W bit, and each byte is acknowledged. Enable with <code>sudo raspi-config</code>, then find devices with <code>i2cdetect -y 1</code>.',
        '<b>SPI</b> — four wires, full duplex, no addressing: the master selects a device by pulling its <b>chip-select</b> line low. Far faster than I²C, at the cost of one extra pin per device. Data is shifted in and out simultaneously on MOSI and MISO.',
        '<b>UART</b> — no clock line at all; both sides must be configured to the same <b>baud rate</b>, and framing is start bit + 8 data bits + optional parity + stop bit. Cross the wires: <b>TX to RX, RX to TX</b>. On the Pi the console must be disabled in raspi-config before the UART is free for your device.',
        '<b>Choosing between them — the answer to "which bus would you use":</b> many slow sensors on few pins → I²C. One fast device (display, SD card, high-rate ADC) → SPI. A single long-distance or legacy device (GPS, GSM modem) → UART.'

      extra:[

        '<b>DHT11 / DHT22</b> — single-wire proprietary protocol, read with <code>Adafruit_DHT</code> / <code>adafruit_dht</code>. Because the timing is microsecond-critical and Linux is not real-time, <b>reads intermittently fail</b> — the correct answer is to retry rather than to treat a failed read as a sensor fault.',
        '<b>HC-SR04 ultrasonic</b> — send a 10 µs pulse on TRIG, time the width of the ECHO pulse, distance in cm = duration × 17150. <b>ECHO outputs 5 V and must be divided down</b> to 3.3 V before it touches the Pi.',

        '<b>Servo motor</b> — position is set by pulse width within a 20 ms (50 Hz) frame: ~1 ms = 0°, ~1.5 ms = 90°, ~2 ms = 180°. Use hardware PWM or <code>pigpio</code>; software PWM jitters visibly.',
        '<b>MCP3008 ADC over SPI</b> — the standard answer to "how do you read an analog sensor on a Pi": 10-bit, 8 channels, read with <code>spidev</code> or <code>gpiozero.MCP3008(channel=0)</code>.',
        '<b>Camera module</b> — CSI ribbon connector, enabled in raspi-config, captured with <code>libcamera-still</code> or <code>picamera2</code>.'

      extra:[
        '<b>A complete answer to any "design an IoT system" question, in six steps:</b> (1) name the sensor and how it interfaces (analog/I²C/SPI/1-Wire); (2) state the logic level and any shifting or driver stage needed; (3) show the read code; (4) state the protocol used to send data upward (MQTT over TLS to a broker, or HTTPS to ThingSpeak); (5) say where processing happens and why (edge for latency and bandwidth, cloud for storage and analytics); (6) name two security controls (TLS and per-device credentials; signed OTA updates). Following that structure guarantees you cover every marking point.',
        '<b>Making it start on boot</b> — a <code>systemd</code> service unit, not <code>rc.local</code> or a cron <code>@reboot</code>. An unattended device that does not restart its own program after a power cut is not deployed, it is a demo.',
        '<b>IoT security controls to name:</b> change default credentials (Mirai spread almost entirely through unchanged factory passwords), disable unused services, unique per-device keys rather than one shared secret, TLS for all transport, signed firmware and OTA updates, and network segmentation putting IoT devices on their own VLAN. This is the natural bridge to your Advanced Network Security paper.'
      ],
      qa:[{q:'Design a smart irrigation system using a Raspberry Pi.',a:'A capacitive soil-moisture sensor is analog, and the Pi has no ADC, so it goes through an MCP3008 on SPI (channel 0, chip-select CE0). A DHT22 on a GPIO gives air temperature and humidity for context. The pump is mains-driven and far beyond the Pi\'s 16 mA per pin, so it is switched by an opto-isolated active-LOW relay module driven from a GPIO, powered from its own supply with a common ground. A Python service started by systemd reads moisture every fifteen minutes, and where the reading is below a threshold and no rain is forecast, energises the relay for a fixed duration with a hard maximum runtime as a safety limit. Readings and pump events are published over MQTT with TLS to a broker, and a dashboard subscribes. The watering decision is made on the Pi rather than in the cloud so that a lost internet connection cannot leave the crop unwatered, with the cloud used for history, alerting and remote override.'}]

SUBJECT.quiz = [
  {q:'Differentiate a microprocessor from a microcontroller.',a:'A microprocessor is a CPU alone: it requires external RAM, ROM and I/O peripherals connected over a bus, is optimised for general-purpose high performance, and is used where a full operating system runs. A microcontroller integrates the CPU, RAM, flash, timers, ADC and GPIO on a single chip, is optimised for low cost and low power, executes a single dedicated program, and is used in embedded control. The defining difference is integration, not speed.'},
  {q:'Explain the four-layer IoT architecture.',a:'Perception layer — sensors, actuators, RFID tags: the physical interface to the world, converting phenomena into data and commands into action. Network layer — gateways and connectivity (Wi-Fi, ZigBee, LoRa, cellular) that transport data upward and perform protocol translation. Processing/middleware layer — storage, filtering, device management and analytics, usually in the cloud, sometimes at the edge. Application layer — the service the user actually sees: dashboards, mobile apps, alerts, automation rules. Some models add a business layer above for models and decision-making.'},
  {q:'Compare I²C, SPI and UART and say when you would choose each.',a:'I²C uses two wires shared by up to 112 addressable devices, is half-duplex at 100–400 kHz, and requires pull-up resistors because it is open-drain — choose it for several slow sensors on limited pins. SPI uses four wires, is full-duplex at tens of megahertz, and has no addressing: each device needs its own chip-select line — choose it for one fast device such as a display, SD card or ADC. UART is asynchronous with no clock, exactly two devices, TX crossed to RX, both configured to the same baud rate — choose it for a single legacy or long-distance device such as a GPS or GSM modem.'},
  {q:'Why does MQTT suit IoT better than HTTP?',a:'MQTT is publish/subscribe through a broker, so publishers and subscribers are decoupled in space, time and synchronisation and a device does not need to know who consumes its data. Its fixed header is two bytes against hundreds of bytes of HTTP text headers, and it holds one persistent connection instead of re-establishing per request — both of which matter enormously for battery and bandwidth. It supports server push without polling, three quality-of-service levels, retained messages so a new subscriber immediately gets the last value, and a Last Will and Testament that announces an ungraceful disconnect, which is how dead devices are detected.'},
  {q:'How would you read an analog sensor on a Raspberry Pi?',a:'The BCM2837 has no ADC, so you add one externally. The standard choices are the MCP3008 — 10-bit, eight channels, over SPI, read with spidev or gpiozero.MCP3008 — or the ADS1115 — 16-bit, four channels, over I²C with a programmable gain amplifier. Wire the sensor output to a channel of the ADC, connect the bus to the Pi\'s SPI or I²C pins, enable that interface in raspi-config, and read the digitised value in Python. If the sensor output exceeds 3.3 V it must be divided down first, since neither the Pi nor the ADC input is 5 V tolerant.'},
  {q:'What is PWM and give three uses?',a:'Pulse Width Modulation rapidly switches a digital output between HIGH and LOW; the duty cycle — the proportion of each period spent HIGH — sets the average voltage delivered to the load. It produces an analog-like effect from a purely digital pin without a DAC. Uses: dimming an LED by varying duty cycle, controlling DC motor speed, and positioning a servo, where the information is carried by the absolute pulse width (about 1–2 ms within a 20 ms frame) rather than by the average.'},
  {q:'Compare the Raspberry Pi and the Arduino, and say when you would use each.',a:'The Pi is a 1.2 GHz quad-core Linux computer with 1 GB RAM, networking, a filesystem, HDMI and camera interfaces; it can run Python, a database and a web server, but its GPIO timing is non-deterministic because the scheduler pre-empts it, it takes about thirty seconds to boot, it has no ADC or RTC, and pulling the power corrupts the SD card. The Arduino runs one program bare-metal on a 16 MHz MCU with 2 KB RAM, boots instantly, tolerates power loss, has six analog inputs, and gives microsecond-accurate deterministic timing — but no networking and no operating system. Use the Pi for computation, connectivity, vision and dashboards; the Arduino for real-time control and analog sensing; and in demanding systems use both, with the Arduino as a real-time front end reporting to the Pi over serial or I²C.'},
  {q:'Explain why an I²C bus needs pull-up resistors.',a:'I²C is an open-drain bus: every device can only pull SDA and SCL LOW by switching a transistor to ground, and none of them can actively drive the line HIGH. The pull-up resistor to VCC is what returns the line to the HIGH state when no device is pulling it down. Without pull-ups the lines float and the bus never registers a logic 1, so no communication occurs. Typical values are 4.7 kΩ, and the Raspberry Pi already provides 1.8 kΩ pull-ups on GPIO2 and GPIO3.'},
  {q:'What is deep sleep on the ESP8266 and what does it require?',a:'Deep sleep powers down the CPU, radio and most peripherals, leaving only the RTC running, dropping consumption from roughly 70 mA while transmitting to about 20 µA. It is entered with ESP.deepSleep(microseconds), and the chip restarts from the top of setup() on waking rather than resuming — so any state must be persisted to RTC memory or flash. Critically, GPIO16 must be physically wired to the RST pin for the chip to wake itself, otherwise it sleeps until manually reset. This is what makes multi-month battery operation possible for a sensor that reports every few minutes.'},
  {q:'List five IoT security risks and a control for each.',a:'Default credentials — enforce unique per-device passwords at provisioning, which is what would have stopped Mirai. Unencrypted transport — run MQTT over TLS on port 8883 with certificate validation rather than plaintext on 1883. No update path — implement signed over-the-air firmware updates so a vulnerability discovered after deployment can actually be fixed. Excessive network exposure — segment IoT devices onto their own VLAN with egress filtering so a compromised bulb cannot reach a file server. Physical access to the device — disable debug interfaces such as UART and JTAG in production, encrypt flash, and store keys in a secure element rather than in the firmware image.'}
];
</script>
<script>
/* ==================================================================
   RENDERER — one template, driven by the SUBJECT object above it.
   Every subject file is this same code with a different SUBJECT, so a
   fix here is a fix everywhere and the three files never drift apart.
   State (checkboxes, open module) is namespaced by SUBJECT.slug, so
   ticking a Blockchain topic never lights up an IoT one.
   ================================================================== */
(function(){
  var S = window.SUBJECT;
  var KEY = 'p1study:' + S.slug;
  var done = {};              // topicId -> true
  try { done = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ done = {}; }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(e){} }

  document.title = 'PLAYER ONE — ' + S.name;
  // Short label only. The hero heading below already carries the full name and
  // code; repeating them here is what pushed the bar past the viewport width.
  document.getElementById('brand').innerHTML = '▮ <b>' + esc(S.short || S.name) + '</b>';

  // ---- flatten topics for search/progress ----
  var allTopics = [];
  S.modules.forEach(function(m){ (m.topics||[]).forEach(function(t){ allTopics.push(t); }); });

  function esc(s){ return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];}); }

  // ---------------- sidebar ----------------
  function buildSide(){
    var el = document.getElementById('side');
    var h = '<div class="tochead">'+esc(S.name)+'</div>';
    h += '<button class="tocmod" onclick="scrollToId(\'top\')"><span class="n">▸</span>Overview &amp; exam plan</button>';
    S.modules.forEach(function(m,i){
      h += '<button class="tocmod" data-mod="'+i+'" onclick="openMod('+i+',true)">'
         + '<span class="n">M'+(i+1)+'</span>'+esc(m.short||m.title)
         + '<span class="pc" id="pc'+i+'"></span></button>';
    });
    if(S.exam){
      h += '<div class="tochead">Self-test</div>';
      h += '<button class="tocmod" onclick="scrollToId(\'quiz\')"><span class="n">?</span>Likely questions</button>';
    }
    el.innerHTML = h;
  }

  // ---------------- topic renderer ----------------
  function renderTopic(t){
    var cls = 'topic' + (done[t.id]?' done':'');
    var h = '<div class="'+cls+'" id="'+t.id+'" data-topic="1">';
    h += '<h3><input type="checkbox" class="chk" '+(done[t.id]?'checked':'')
       + ' onchange="toggleTopic(\''+t.id+'\',this.checked)"><span>'+esc(t.title)+'</span>';
    if(t.tag==='min') h += '';
    h += '</h3>';
    if(t.def) h += '<div class="def">'+t.def+'</div>';
    if(t.points && t.points.length){
      h += '<ul class="pts">';
      t.points.forEach(function(p){ h += '<li>'+p+'</li>'; });
      h += '</ul>';
    }
    if(t.table) h += renderTable(t.table);
    if(t.extra) h += box('extra','EXTRA MARKS ✦', t.extra);
    if(t.trap)  h += box('trap','EXAM TRAP ⚠', t.trap);
    if(t.mnem)  h += box('mnem','REMEMBER IT ◆', t.mnem);
    if(t.qa && t.qa.length){
      t.qa.forEach(function(q){
        h += '<div class="qa" onclick="this.classList.toggle(\'open\')">'
           + '<div class="qq"><span class="m">Q</span><span>'+esc(q.q)+'</span></div>'
           + '<div class="aa">'+q.a+'</div></div>';
      });
    }
    h += '</div>';
    return h;
  }
  function box(cls,label,body){
    var inner = Array.isArray(body)
      ? '<ul>'+body.map(function(x){return '<li>'+x+'</li>';}).join('')+'</ul>'
      : '<div>'+body+'</div>';
    return '<div class="box '+cls+'"><div class="bh">'+label+'</div>'+inner+'</div>';
  }
  function renderTable(tb){
    var h = '<table><thead><tr>';
    tb.head.forEach(function(c){ h += '<th>'+esc(c)+'</th>'; });
    h += '</tr></thead><tbody>';
    tb.rows.forEach(function(r){
      h += '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';
    });
    h += '</tbody></table>';
    return h;
  }

  // ---------------- main ----------------
  function buildMain(){
    var el = document.getElementById('main');
    var h = '';
    h += '<div class="hero" id="top">'
       + '<div class="code">'+esc(S.code)+' · MINOR EXAM · '+esc(S.examLabel||'')+'</div>'
       + '<h1>'+esc(S.name)+'</h1>'
       + '<p>'+esc(S.blurb||'')+'</p>';
    if(S.plan){
      h += '<div class="box extra" style="margin-bottom:0"><div class="bh">HOW TO USE THIS ✦</div><ul>'
         + S.plan.map(function(x){return '<li>'+x+'</li>';}).join('') + '</ul></div>';
    }
    h += '</div>';

    S.modules.forEach(function(m,i){
      h += '<section class="mod" id="mod'+i+'" data-mod="'+i+'">';
      h += '<div class="modhead" onclick="openMod('+i+')">'
         + '<span class="caret">▶</span>'
         + '<h2><span style="color:var(--ink-3)">M'+(i+1)+'</span> &nbsp;'+esc(m.title)+'</h2>';
      if(m.weight) h += '<span class="wt">'+esc(m.weight)+'</span>';
      h += '</div>';
      h += '<div class="modbody">';
      if(m.intro) h += '<p style="color:var(--ink-2);font-size:12.5px;margin:8px 0 2px">'+m.intro+'</p>';
      (m.topics||[]).forEach(function(t){ h += renderTopic(t); });
      h += '</div></section>';
    });

    if(S.quiz && S.quiz.length){
      h += '<section class="mod open" id="quiz"><div class="modhead"><span class="caret">▶</span>'
         + '<h2><span style="color:var(--ink-3)">✱</span> &nbsp;Most likely questions — rapid self-test</h2></div>';
      h += '<div class="modbody">';
      h += '<p style="color:var(--ink-2);font-size:12.5px">Tap to reveal. If you can answer these cold, you are ready.</p>';
      S.quiz.forEach(function(q){
        h += '<div class="qa" onclick="this.classList.toggle(\'open\')">'
           + '<div class="qq"><span class="m">Q</span><span>'+esc(q.q)+'</span></div>'
           + '<div class="aa">'+q.a+'</div></div>';
      });
      h += '</div></section>';
    }

    h += '<div class="foot">'+ (S.foot||'') +'<br>Generated for Neel · PLAYER ONE life-dashboard · offline-ready, no network calls. '
       + 'Progress is saved on this device. Print to PDF for a paper copy.</div>';
    el.innerHTML = h;
  }

  // ---------------- interactions ----------------
  window.openMod = function(i, fromNav){
    var mod = document.getElementById('mod'+i);
    if(!mod) return;
    if(fromNav){ mod.classList.add('open'); }
    else { mod.classList.toggle('open'); }
    document.querySelectorAll('.tocmod[data-mod]').forEach(function(b){
      b.classList.toggle('on', +b.getAttribute('data-mod')===i);
    });
    if(fromNav){ mod.scrollIntoView({behavior:'smooth',block:'start'}); closeSideMobile(); }
    updateRail();
  };
  window.expandAll = function(on){
    document.querySelectorAll('.mod').forEach(function(m){ if(m.id!=='quiz') m.classList.toggle('open',on); });
    updateRail();
  };
  window.toggleTopic = function(id,val){
    if(val) done[id]=true; else delete done[id];
    save();
    var t=document.getElementById(id); if(t) t.classList.toggle('done',!!val);
    updateProgress();
  };
  window.scrollToId = function(id){ var e=document.getElementById(id); if(e){e.scrollIntoView({behavior:'smooth',block:'start'});} closeSideMobile(); };
  window.jumpNext = function(){
    for(var i=0;i<S.modules.length;i++){
      var ts=S.modules[i].topics||[];
      var undoneLeft = ts.some(function(t){return !done[t.id];});
      if(undoneLeft){ openMod(i,true); return; }
    }
    scrollTo(0,0);
  };
  window.toggleSide = function(){
    document.getElementById('side').classList.toggle('open');
    document.getElementById('scrim').classList.toggle('on');
  };
  function closeSideMobile(){
    if(window.innerWidth<=900){
      document.getElementById('side').classList.remove('open');
      document.getElementById('scrim').classList.remove('on');
    }
  }
  window.toggleCRT = function(){ document.body.classList.toggle('plain'); };

  // ---------------- progress ----------------
  function updateProgress(){
    var total=allTopics.length, n=0;
    allTopics.forEach(function(t){ if(done[t.id]) n++; });
    var pct = total? Math.round(n/total*100):0;
    document.getElementById('pcnt').textContent = pct+'%';
    document.getElementById('railfill').style.width = pct+'%';
    S.modules.forEach(function(m,i){
      var ts=m.topics||[], mn=0; ts.forEach(function(t){ if(done[t.id]) mn++; });
      var el=document.getElementById('pc'+i);
      if(el) el.textContent = ts.length? (mn+'/'+ts.length):'';
    });
  }
  function updateRail(){ /* rail reflects scroll depth on wide screens */ }

  // ---------------- search ----------------
  var qEl = document.getElementById('q');
  var timer=null;
  qEl.addEventListener('input', function(){
    clearTimeout(timer); timer=setTimeout(function(){ runSearch(qEl.value.trim().toLowerCase()); },120);
  });
  function runSearch(term){
    var main=document.getElementById('main');
    var old=document.getElementById('nores'); if(old) old.remove();
    if(!term){
      document.querySelectorAll('[data-topic]').forEach(function(t){ t.classList.remove('hidden'); unmark(t); });
      document.querySelectorAll('.mod').forEach(function(m){ m.classList.remove('hidden'); });
      return;
    }
    var hits=0;
    document.querySelectorAll('.mod').forEach(function(m){
      if(m.id==='quiz'){ m.classList.add('hidden'); return; }
      var any=false;
      m.querySelectorAll('[data-topic]').forEach(function(t){
        var txt=t.textContent.toLowerCase();
        var match=txt.indexOf(term)>=0;
        t.classList.toggle('hidden',!match);
        if(match){ any=true; hits++; }
      });
      m.classList.toggle('hidden',!any);
      if(any) m.classList.add('open');
    });
    if(!hits){
      var d=document.createElement('div'); d.id='nores';
      d.textContent='No topic mentions “'+term+'”. Try a shorter word.';
      main.appendChild(d);
    }
  }
  function unmark(){}

  // keyboard: "/" focuses search
  document.addEventListener('keydown',function(e){
    if(e.key==='/' && document.activeElement!==qEl){ e.preventDefault(); qEl.focus(); }
    if(e.key==='Escape'){ qEl.value=''; runSearch(''); qEl.blur(); }
  });

  // ---------------- boot ----------------
  buildSide(); buildMain(); updateProgress();
  if(S.modules[0]) document.getElementById('mod0').classList.add('open');
})();
</script>
</body>
</html>
